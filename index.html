<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM Pro - Multi-Stage Leave System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
        .page-section { display: none; }
        .active { display: block; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .btn-action { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="text-slate-800">

    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm border-b">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-indigo-200 shadow-lg">
                <i class="fa-solid fa-layer-group text-xl"></i>
            </div>
            <div>
                <span class="text-xl font-black block leading-none text-slate-900 tracking-tight">HRM SYSTEM</span>
                <span class="text-[9px] text-indigo-500 font-bold uppercase tracking-widest">Enterprise Edition</span>
            </div>
        </div>
        <button id="backBtn" onclick="showPage('portal')" class="hidden bg-slate-100 text-slate-600 px-5 py-2 rounded-xl text-xs font-bold hover:bg-slate-200 transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก
        </button>
    </nav>

    <div class="container mx-auto p-4 max-w-6xl">
        
        <div id="page-portal" class="page-section active mt-16">
            <div class="text-center mb-16">
                <h1 class="text-5xl font-black text-slate-900 mb-4 tracking-tighter">ระบบจัดการการลา</h1>
                <p class="text-slate-500 text-lg">กรุณาเลือกเข้าใช้งานตามบทบาทหน้าที่</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-3xl mx-auto">
                <div onclick="showPage('employee')" class="glass p-12 text-center rounded-[3rem] cursor-pointer btn-action border-b-8 border-indigo-600 shadow-xl">
                    <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6"><i class="fa-solid fa-paper-plane text-3xl"></i></div>
                    <h3 class="text-2xl font-bold mb-1">พนักงาน</h3>
                    <p class="text-slate-400">แจ้งลาและดูผลอนุมัติ</p>
                </div>
                <div onclick="showPage('login')" class="glass p-12 text-center rounded-[3rem] cursor-pointer btn-action border-b-8 border-slate-900 shadow-xl">
                    <div class="w-20 h-20 bg-slate-100 text-slate-800 rounded-3xl flex items-center justify-center mx-auto mb-6"><i class="fa-solid fa-user-shield text-3xl"></i></div>
                    <h3 class="text-2xl font-bold mb-1">ระดับบริหาร</h3>
                    <p class="text-slate-400">ตรวจสอบและกดอนุมัติลา</p>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section mt-16">
            <div class="glass p-12 max-w-md mx-auto rounded-[3rem] shadow-2xl text-center border-t-8 border-slate-900">
                <i class="fa-solid fa-lock-open text-slate-200 text-5xl mb-6"></i>
                <h3 class="text-2xl font-bold mb-8 tracking-tight">Security Access</h3>
                <input type="password" id="adminPass" placeholder="ระบุรหัสผ่านตำแหน่ง" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl mb-6 text-center text-2xl outline-none focus:border-indigo-500 transition-all">
                <button onclick="checkLogin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl hover:scale-[0.98] transition-all">เข้าสู่ระบบผู้อนุมัติ</button>
            </div>
        </div>

        <div id="page-employee" class="page-section mt-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 glass p-8 rounded-[2.5rem] shadow-xl border-t-8 border-indigo-600">
                    <h3 class="font-bold text-xl mb-6 flex items-center gap-2"><i class="fa-solid fa-file-pen text-indigo-600"></i> สร้างใบคำขอลา</h3>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="bg-slate-50 p-4 rounded-2xl outline-none w-full focus:ring-2 ring-indigo-100">
                            <input type="text" id="empId" placeholder="รหัสพนักงาน" class="bg-slate-50 p-4 rounded-2xl outline-none w-full focus:ring-2 ring-indigo-100">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <select id="empLine" class="bg-slate-50 p-4 rounded-2xl outline-none w-full"><option>Line C</option><option>Line E</option><option>Line F</option><option>Line TC</option></select>
                            <select id="empProcess" class="bg-indigo-50 p-4 rounded-2xl outline-none w-full font-bold text-indigo-700"><option value="Assy">Assy</option><option value="Elec">Elec</option><option value="Pack">Pack</option></select>
                        </div>
                        <select id="leaveType" class="bg-slate-50 p-4 rounded-2xl outline-none w-full"><option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option></select>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-2">เริ่ม</label><input type="date" id="dateStart" class="bg-slate-50 p-4 rounded-2xl w-full text-sm"></div>
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-2">สิ้นสุด</label><input type="date" id="dateEnd" class="bg-slate-50 p-4 rounded-2xl w-full text-sm"></div>
                        </div>
                        <textarea id="leaveReason" placeholder="เหตุผลการลา..." class="bg-slate-50 p-4 rounded-2xl outline-none w-full h-24"></textarea>
                        <button onclick="submitLeave()" id="submitBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg btn-action">ส่งใบลา</button>
                    </div>
                </div>
                <div class="lg:col-span-7 glass p-8 rounded-[2.5rem] shadow-xl">
                    <h3 class="font-bold text-xl mb-6">สถานะการลาล่าสุด</h3>
                    <div id="empList" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="page-section mt-6">
            <div class="flex justify-between items-center mb-10 bg-white p-6 rounded-[2rem] shadow-sm">
                <div>
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Inbox อนุมัติ</h2>
                    <p id="roleBadge" class="text-indigo-600 font-bold bg-indigo-50 px-3 py-1 rounded-lg inline-block mt-2 text-xs uppercase"></p>
                </div>
                <button onclick="fetchData()" class="bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold btn-action flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i> ดึงข้อมูล
                </button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <script>
        // *** วาง URL ของ Google Web App ที่นี่ ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwVH2DYQGn23fbIPRm0qfGEdtdthOFuplb1SjcSiQIqWqcM4lgEhxNuu9uawsBO8kbc/exec';
        
        let currentRole = "";
        let rawData = [];

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('backBtn').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'approver') fetchData();
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === '7843') currentRole = "Assy";
            else if (pass === '1332') currentRole = "Elec";
            else if (pass === '80006') currentRole = "Pack";
            else if (pass === '7605') currentRole = "Sup";
            else if (pass === '6419') currentRole = "Senior_Sup";
            else if (pass === '10106') currentRole = "Asst_Chief";
            else if (pass === '9764') currentRole = "Manager";
            else return alert('⚠️ รหัสผ่านไม่ถูกต้อง');
            document.getElementById('roleBadge').innerText = "ระดับ: " + currentRole.replace('_', ' ');
            showPage('approver');
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const data = {
                action: 'addLeave',
                name: document.getElementById('empName').value,
                empId: document.getElementById('empId').value,
                line: document.getElementById('empLine').value,
                process: document.getElementById('empProcess').value,
                empStatus: 'พนักงานประจำ',
                leaveType: document.getElementById('leaveType').value,
                start: document.getElementById('dateStart').value,
                end: document.getElementById('dateEnd').value,
                reason: document.getElementById('leaveReason').value || '-'
            };
            if (!data.name || !data.empId) return alert('⚠️ กรุณากรอกชื่อและรหัสพนักงาน');
            btn.disabled = true; btn.innerText = "กำลังดำเนินการ...";
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                alert('✅ ส่งใบลาสำเร็จ'); location.reload();
            } catch (e) { alert('❌ เกิดข้อผิดพลาด'); btn.disabled = false; }
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL + "?t=" + Date.now());
                rawData = await res.json();
                renderUI();
            } catch (e) { console.error("Fetch error"); }
        }

        function renderUI() {
            const empArea = document.getElementById('empList');
            const managerArea = document.getElementById('managerList');
            const rows = rawData.slice().reverse();

            empArea.innerHTML = rows.map(r => `
                <div class="flex items-center justify-between p-5 bg-white rounded-3xl border border-slate-50 shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center font-bold text-slate-300 text-xs border">${r[0].charAt(0)}</div>
                        <div>
                            <div class="font-bold text-slate-800">${r[0]}</div>
                            <div class="text-[10px] font-bold text-indigo-500 uppercase tracking-tighter">${r[10]} | ${r[4]} - ${r[5]}</div>
                        </div>
                    </div>
                    <div class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase text-white ${r[7] === 'Approved' ? 'bg-emerald-500' : (r[7] === 'Rejected' ? 'bg-rose-500' : 'bg-amber-400')}">
                        ${r[7].replace(/_/g, ' ')}
                    </div>
                </div>`).join('');

            let filtered = [];
            if (['Assy', 'Elec', 'Pack'].includes(currentRole)) filtered = rows.filter(r => r[10] === currentRole && r[7] === "Pending");
            else if (currentRole === "Sup") filtered = rows.filter(r => r[7] === "Foreman_Approved");
            else if (currentRole === "Senior_Sup") filtered = rows.filter(r => r[7] === "Sup_Approved");
            else if (currentRole === "Asst_Chief") filtered = rows.filter(r => r[7] === "SeniorSup_Approved");
            else if (currentRole === "Manager") filtered = rows.filter(r => r[7] === "AsstChief_Approved");

            managerArea.innerHTML = filtered.map(r => `
                <div class="glass p-8 rounded-[2.5rem] border-l-[12px] border-indigo-600 shadow-xl hover:scale-[1.02] transition-all">
                    <div class="flex justify-between mb-4">
                        <h4 class="text-2xl font-black text-slate-900">${r[0]}</h4>
                        <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-xl text-xs font-bold">${r[3]}</span>
                    </div>
                    <div class="bg-slate-50 p-5 rounded-3xl mb-6 text-sm">
                        <p class="mb-1 text-slate-400 font-bold uppercase text-[10px]">ช่วงวันลา:</p>
                        <p class="font-bold text-slate-700">${r[4]} ถึง ${r[5]}</p>
                        <p class="mt-4 text-slate-400 font-bold uppercase text-[10px]">เหตุผล:</p>
                        <p class="text-slate-600 italic">${r[6]}</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-50 btn-action">อนุมัติ</button>
                        <button onclick="updateStatus(${r[16]}, 'Rejected')" class="flex-1 bg-white border-2 border-rose-100 text-rose-500 py-4 rounded-2xl font-bold hover:bg-rose-50 btn-action">ปฏิเสธ</button>
                    </div>
                </div>`).join('');

            if(filtered.length === 0) managerArea.innerHTML = "<p class='col-span-full text-center text-slate-400 py-20 bg-white rounded-[3rem] border-2 border-dashed border-slate-200 font-bold'>🎉 ยอดเยี่ยม! ไม่มีรายการรอดำเนินการ</p>";
        }

        async function updateStatus(rowIdx, newStatus) {
            if(!confirm('ยืนยันรายการนี้?')) return;
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) });
                alert('ดำเนินการสำเร็จ'); fetchData();
            } catch (e) { alert('ผิดพลาด'); }
        }
    </script>
</body>
</html>
