<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Kanit', sans-serif; background: #f8fafc; }</style>
</head>
<body class="p-4 md:p-10">
    <div id="app" class="max-w-2xl mx-auto bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
        <div id="nav" class="flex gap-4 mb-8">
            <button onclick="show('form')" class="px-6 py-2 bg-indigo-600 text-white rounded-full text-sm font-medium">ส่งคำร้อง</button>
            <button onclick="checkAdmin()" class="px-6 py-2 bg-slate-100 text-slate-600 rounded-full text-sm font-medium">อนุมัติ</button>
        </div>

        <div id="form-section">
            <h2 class="text-2xl font-bold mb-6 text-slate-800">ส่งคำร้องขอลา</h2>
            <div class="grid grid-cols-2 gap-4">
                <input id="name" placeholder="ชื่อ-นามสกุล" class="p-3 border rounded-xl w-full col-span-2">
                <input id="empId" placeholder="รหัสพนักงาน" class="p-3 border rounded-xl">
                <select id="empStatus" class="p-3 border rounded-xl"><option>พนักงานประจำ</option><option>พนักงานชั่วคราว</option></select>
                <select id="leaveType" class="p-3 border rounded-xl"><option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option></select>
                <select id="line" class="p-3 border rounded-xl"><option>C</option><option>E</option><option>F</option><option>TC</option><option>OFFICE</option></select>
                <input id="start" type="date" class="p-3 border rounded-xl">
                <input id="end" type="date" class="p-3 border rounded-xl">
                <textarea id="reason" placeholder="เหตุผลการลา" class="p-3 border rounded-xl col-span-2 h-24"></textarea>
                <input type="file" id="file" class="col-span-2 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:bg-indigo-50 file:text-indigo-700">
            </div>
            <button onclick="submit()" id="btn" class="w-full mt-6 py-3 bg-indigo-600 text-white rounded-xl font-bold">ส่งคำร้อง</button>
        </div>
    </div>

    <script>
        async function submit() {
            const btn = document.getElementById('btn');
            const file = document.getElementById('file').files[0];
            let fileData = "";
            if(file) {
                fileData = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = e => r(e.target.result);
                    reader.readAsDataURL(file);
                });
            }
            
            const data = {
                action: 'addLeave',
                name: document.getElementById('name').value,
                empId: document.getElementById('empId').value,
                status: document.getElementById('empStatus').value,
                type: document.getElementById('leaveType').value,
                line: document.getElementById('line').value,
                start: document.getElementById('start').value,
                end: document.getElementById('end').value,
                reason: document.getElementById('reason').value,
                fileData: fileData,
                fileName: file ? file.name : ""
            };
            
            btn.innerText = "กำลังส่ง...";
            await fetch('<?= ScriptApp.getService().getUrl() ?>', { method: 'POST', body: JSON.stringify(data) });
            alert('ส่งสำเร็จ!');
            location.reload();
        }

        function checkAdmin() {
            const pass = prompt("กรุณาใส่รหัสผ่าน:");
            if(pass === "1234") {
                alert("เข้าสู่ระบบผู้ดูแล - ให้ใช้ลิงก์ Google Sheet เพื่อตรวจสอบรูปภาพ");
                window.open('https://script.google.com/macros/s/AKfycbyGK6OxVBNN7TQXAd87SB2lAztjZ7IYWYTPICFZbqBQVTFFLw0cmREUb6_5SKSCV0fXgQ/exec', '_blank');
            } else {
                alert("รหัสผ่านไม่ถูกต้อง");
            }
        }
    </script>
</body>
</html>
