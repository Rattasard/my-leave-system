<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลางาน v.Realtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .page-section { display: none; }
        .page-active { display: block !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold cursor-pointer" onclick="window.location.reload()">ระบบจัดการการลา</h1>
        <button id="backBtn" onclick="changePage('portal')" class="hidden bg-white/20 px-4 py-1 rounded text-sm border">กลับหน้าหลัก</button>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl">
        <div id="page-portal" class="page-section page-active mt-12 text-center">
            <h2 class="text-2xl font-bold mb-10 text-gray-700">ยินดีต้อนรับ</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto">
                <button onclick="changePage('employee')" class="bg-white p-8 rounded-2xl shadow border-2 hover:border-blue-500 transition-all">
                    <i class="fa-solid fa-user text-4xl text-blue-600 mb-2"></i>
                    <p class="font-bold">พนักงาน (แจ้งลา / เช็คสถานะ)</p>
                </button>
                <button onclick="changePage('login')" class="bg-white p-8 rounded-2xl shadow border-2 hover:border-gray-800 transition-all">
                    <i class="fa-solid fa-user-check text-4xl text-gray-700 mb-2"></i>
                    <p class="font-bold">ผู้อนุมัติ (Manager)</p>
                </button>
            </div>
        </div>

        <div id="page-login" class="page-section mt-12 max-w-md mx-auto text-center">
            <div class="bg-white p-8 rounded-xl shadow border">
                <h2 class="text-xl font-bold mb-6">เข้าสู่ระบบผู้อนุมัติ</h2>
                <input type="password" id="adminPass" placeholder="รหัสผ่าน (1234)" class="w-full border p-3 rounded-lg mb-4 text-center">
                <button onclick="handleLogin()" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold">ยืนยัน</button>
            </div>
        </div>

        <div id="page-employee" class="page-section mt-4">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow border h-fit">
                    <h3 class="font-bold text-blue-900 mb-4 border-b pb-2">แบบฟอร์มการลา</h3>
                    <div class="space-y-3">
                        <input type="text" id="empName" placeholder="ชื่อ-นามสกุล *" class="w-full border p-2 rounded text-sm">
                        <input type="text" id="empId" placeholder="รหัสพนักงาน *" class="w-full border p-2 rounded text-sm">
                        <select id="empStatus" class="w-full border p-2 rounded text-sm bg-gray-50">
                            <option value="พนักงานประจำ">1. ประจำ</option>
                            <option value="พนักงานชั่วคราว">2. ชั่วคราว</option>
                        </select>
                        <select id="leaveType" class="w-full border p-2 rounded text-sm bg-gray-50">
                            <option value="ลาป่วย">ลาป่วย</option>
                            <option value="ลากิจ">ลากิจ</option>
                            <option value="ลาพักร้อน">ลาพักร้อน</option>
                        </select>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="dateStart" class="border p-2 rounded text-xs">
                            <input type="date" id="dateEnd" class="border p-2 rounded text-xs">
                        </div>
                        <textarea id="leaveReason" placeholder="เหตุผล" class="w-full border p-2 rounded text-sm h-20"></textarea>
                        <button onclick="saveLeave()" id="submitBtn" class="w-full bg-blue-800 text-white py-2 rounded font-bold">ส่งข้อมูล</button>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border">
                    <h3 class="font-bold mb-4 border-b pb-2 text-gray-700">สถานะการลาล่าสุด</h3>
                    <div id="empStatusList" class="min-h-[300px]">กำลังโหลด...</div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="page-section mt-4">
            <h2 class="text-xl font-bold mb-6 text-blue-900 border-b-2 border-blue-900 inline-block">รายการรอพิจารณา</h2>
            <div id="approverList" class="space-y-4">กำลังโหลด...</div>
        </div>
    </div>

    <script>
        // *** สำคัญ: วาง URL Web App ของคุณที่นี่ ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwQNdqnr59XsQInKcJahOpaBHfIVOAuyjz7s4N9ZQYrTDmVKW02lkNOz9jTYivojx_F/exec';

        function changePage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('page-active'));
            document.getElementById('page-' + pageId).classList.add('page-active');
            document.getElementById('backBtn').classList.toggle('hidden', pageId === 'portal');
            if(pageId === 'employee' || pageId === 'approver') loadData();
        }

        function handleLogin() {
            if(document.getElementById('adminPass').value === '1234') changePage('approver');
            else alert('รหัสผ่านไม่ถูกต้อง');
        }

        async function saveLeave() {
            const btn = document.getElementById('submitBtn');
            const data = { action: 'addLeave', name: document.getElementById('empName').value, empId: document.getElementById('empId').value, empStatus: document.getElementById('empStatus').value, leaveType: document.getElementById('leaveType').value, start: document.getElementById('dateStart').value, end: document.getElementById('dateEnd').value, reason: document.getElementById('leaveReason').value || '-' };
            if(!data.name || !data.start) return alert('กรอกชื่อและวันที่เริ่มลาให้ครบ');
            btn.disabled = true; btn.innerText = 'กำลังบันทึก...';
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            alert('บันทึกสำเร็จ!');
            window.location.reload();
        }

        async function loadData() {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                renderTables(data);
            } catch (e) { console.error('Error loading data:', e); }
        }

        function renderTables(data) {
            const empArea = document.getElementById('empStatusList');
            const appArea = document.getElementById('approverList');
            const rows = data.slice().reverse();

            // แสดงหน้าพนักงาน
            empArea.innerHTML = `<table class="w-full text-sm border">
                <thead class="bg-gray-50 text-xs"><tr><th class="p-2 border text-left">ชื่อ / ประเภท</th><th class="p-2 border text-center">สถานะ</th></tr></thead>
                <tbody>${rows.map(r => `<tr>
                    <td class="p-2 border"><b>${r[0]}</b> <span class="text-[10px] text-blue-600">(${r[2]})</span><br><small>${r[3]}: ${r[4]}</small></td>
                    <td class="p-2 border text-center">
                        <span class="px-2 py-0.5 rounded-full text-[10px] text-white font-bold ${r[7]==='Approved'?'bg-green-600':(r[7]==='Rejected'?'bg-red-600':'bg-amber-500')}">${r[7]}</span>
                    </td>
                </tr>`).join('')}</tbody>
            </table>`;

            // แสดงหน้าผู้อนุมัติ
            appArea.innerHTML = rows.map((r, i) => {
                const status = r[7];
                const cardId = `card-${i}`;
                return `
                <div id="${cardId}" class="bg-white p-5 rounded-xl border-l-8 ${status==='Approved'?'border-green-600':(status==='Rejected'?'border-red-600':'border-amber-500')} shadow flex justify-between items-center transition-all">
                    <div>
                        <div class="font-bold text-lg text-gray-800">${r[0]} <span class="text-xs font-normal text-gray-500">(${r[2]})</span></div>
                        <p class="text-sm text-blue-800 font-bold">${r[3]}: ${r[4]} ถึง ${r[5]}</p>
                        <p class="text-xs text-gray-400 italic">เหตุผล: ${r[6]}</p>
                    </div>
                    <div id="btn-group-${cardId}">
                        ${status === 'Pending' ? `
                            <div class="flex gap-2">
                                <button onclick="updateStatusOnline('${r[0]}','${r[4]}','Approved','${cardId}')" class="bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow hover:bg-green-700 transition-colors">อนุมัติ</button>
                                <button onclick="updateStatusOnline('${r[0]}','${r[4]}','Rejected','${cardId}')" class="bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow hover:bg-red-700 transition-colors">ปฏิเสธ</button>
                            </div>
                        ` : `<span class="font-black text-lg ${status==='Approved'?'text-green-600':'text-red-600'}">${status}</span>`}
                    </div>
                </div>`;
            }).join('');
        }

        async function updateStatusOnline(name, start, status, cardId) {
            if(!confirm(`คุณต้องการ ${status} รายการนี้ใช่หรือไม่?`)) return;

            // 1. เปลี่ยนสี UI ทันทีไม่ต้องรอ (Optimistic UI)
            const card = document.getElementById(cardId);
            const btnGroup = document.getElementById(`btn-group-${cardId}`);
            card.style.borderLeftColor = status === 'Approved' ? '#16a34a' : '#dc2626';
            btnGroup.innerHTML = `<span class="font-black text-lg ${status==='Approved'?'text-green-600':'text-red-600'} animate-pulse">${status}</span>`;

            try {
                // 2. ส่งข้อมูลไปอัปเดต Google Sheets
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'updateStatus', name: name, start: start, status: status })
                });
                
                // 3. รีโหลดข้อมูลใหม่ลับหลังเพื่อให้หน้าพนักงานอัปเดตตาม
                setTimeout(loadData, 2000); 
            } catch (e) {
                alert('การเชื่อมต่อผิดพลาด ข้อมูลอาจไม่อัปเดตใน Sheet');
                loadData(); // รีเซ็ตหน้าจอใหม่
            }
        }
    </script>
</body>
</html>
