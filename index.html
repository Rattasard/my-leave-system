<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Leave System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background: #f0f2f5; }
        .page-section { display: none; }
        .active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn-type-active { background-color: #4f46e5 !important; color: white !important; }
    </style>
</head>
<body class="text-slate-700">

    <nav class="bg-indigo-900 text-white shadow-lg p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <i class="fa-solid fa-briefcase text-2xl"></i>
            <span class="text-xl font-bold tracking-tight">ระบบลาพนักงาน</span>
        </div>
        <button id="backBtn" onclick="showPage('portal')" class="hidden bg-white/20 hover:bg-white/30 px-4 py-1 rounded-lg transition">กลับหน้าหลัก</button>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl">
        
        <div id="page-portal" class="page-section active mt-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-2xl mx-auto">
                <div onclick="showPage('employee')" class="bg-white p-12 rounded-3xl shadow-md border-b-4 border-indigo-500 text-center cursor-pointer hover:scale-105 transition-all">
                    <i class="fa-solid fa-user-pen text-5xl text-indigo-500 mb-4"></i>
                    <h3 class="text-2xl font-bold">แจ้งลา / เช็คสถานะ</h3>
                </div>
                <div onclick="showPage('login')" class="bg-white p-12 rounded-3xl shadow-md border-b-4 border-slate-700 text-center cursor-pointer hover:scale-105 transition-all">
                    <i class="fa-solid fa-user-shield text-5xl text-slate-700 mb-4"></i>
                    <h3 class="text-2xl font-bold">ผู้อนุมัติ (Manager)</h3>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section mt-20">
            <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm mx-auto text-center border">
                <h3 class="text-xl font-bold mb-6">กรุณาระบุรหัสผ่าน</h3>
                <input type="password" id="adminPass" class="w-full border-2 p-3 rounded-xl mb-4 text-center text-2xl outline-none focus:border-indigo-500">
                <button onclick="checkLogin()" class="w-full bg-indigo-900 text-white py-3 rounded-xl font-bold hover:bg-black transition">เข้าสู่ระบบ</button>
            </div>
        </div>

        <div id="page-employee" class="page-section mt-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow border">
                    <h3 class="font-bold text-lg mb-6 flex items-center gap-2 text-indigo-900">
                        <i class="fa-solid fa-file-signature"></i> ส่งใบลา
                    </h3>
                    <div class="space-y-4">
                        <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                        <input type="text" id="empId" placeholder="รหัสพนักงาน" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setType('พนักงานประจำ')" id="type-p" class="type-btn border py-2 rounded-xl text-sm font-bold bg-slate-50">พนักงานประจำ</button>
                            <button onclick="setType('พนักงานชั่วคราว')" id="type-t" class="type-btn border py-2 rounded-xl text-sm font-bold bg-slate-50">พนักงานชั่วคราว</button>
                        </div>

                        <select id="leaveType" class="w-full border p-3 rounded-xl bg-slate-50">
                            <option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option>
                        </select>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="dateStart" class="w-full border p-2 rounded-xl text-xs">
                            <input type="date" id="dateEnd" class="w-full border p-2 rounded-xl text-xs">
                        </div>
                        <textarea id="leaveReason" placeholder="เหตุผลการลา" class="w-full border p-3 rounded-xl h-24 outline-none"></textarea>
                        <button onclick="submitLeave()" id="submitBtn" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">ส่งคำขอลา</button>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow border">
                    <h3 class="font-bold text-lg mb-6 border-b pb-2">ประวัติการลาล่าสุด</h3>
                    <div id="empList" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="page-section mt-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">รายการรอนุมัติ</h2>
                <button onclick="fetchData()" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-200 transition">
                    <i class="fa-solid fa-rotate mr-1"></i> รีเฟรช
                </button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

    </div>

    <script>
        // *** สำคัญ: ก๊อป URL จากการ Deploy มาวางตรงนี้ ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzDa_7ZOLBjoiL9-CO4uhljaVJVoKkJNYe63sbGD9wCa7uk-MIinxE5DRQDgnQ0rdDE/exec';
        
        let selectedType = 'พนักงานประจำ';

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('backBtn').classList.toggle('hidden', id === 'portal');
            if (id === 'employee' || id === 'approver') fetchData();
            if (id === 'employee') setType('พนักงานประจำ');
        }

        function setType(type) {
            selectedType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('btn-type-active'));
            if (type === 'พนักงานประจำ') document.getElementById('type-p').classList.add('btn-type-active');
            else document.getElementById('type-t').classList.add('btn-type-active');
        }

        function checkLogin() {
            if (document.getElementById('adminPass').value === '1234') showPage('approver');
            else alert('รหัสผ่านไม่ถูกต้อง');
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const data = {
                action: 'addLeave',
                name: document.getElementById('empName').value,
                empId: document.getElementById('empId').value,
                empStatus: selectedType,
                leaveType: document.getElementById('leaveType').value,
                start: document.getElementById('dateStart').value,
                end: document.getElementById('dateEnd').value,
                reason: document.getElementById('leaveReason').value || '-'
            };

            if (!data.name || !data.empId || !data.start) return alert('กรุณากรอกข้อมูลสำคัญ (ชื่อ, รหัส, วันลา)');

            btn.disabled = true; btn.innerText = 'กำลังบันทึก...';
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                alert('ส่งใบลาเรียบร้อยแล้ว');
                window.location.reload();
            } catch (e) { alert('เกิดข้อผิดพลาด'); btn.disabled = false; }
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL + '?t=' + new Date().getTime());
                const data = await res.json();
                renderUI(data);
            } catch (e) { console.error("Error loading data", e); }
        }

        function renderUI(data) {
            const empArea = document.getElementById('empList');
            const managerArea = document.getElementById('managerList');
            const rows = data.slice().reverse();

            // แสดงหน้าพนักงาน
            empArea.innerHTML = rows.map(r => `
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border">
                    <div>
                        <div class="font-bold text-sm">${r[0]} <span class="text-xs text-indigo-500 ml-2">(${r[1]})</span></div>
                        <div class="text-[11px] text-slate-500 uppercase">${r[3]} | ${r[4]} ถึง ${r[5]}</div>
                    </div>
                    <div class="px-3 py-1 rounded-full text-[10px] font-bold text-white ${r[7]==='Approved'?'bg-green-500':(r[7]==='Rejected'?'bg-red-500':'bg-amber-400')}">
                        ${r[7]}
                    </div>
                </div>
            `).join('');

            // แสดงหน้าผู้จัดการ
            managerArea.innerHTML = rows.map(r => `
                <div id="row-${r[8]}" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center transition-all">
                    <div>
                        <h4 class="font-bold text-lg">${r[0]} <small class="text-slate-400">ID: ${r[1]}</small></h4>
                        <p class="text-sm text-indigo-600 font-bold">${r[3]} : ${r[4]} ถึง ${r[5]}</p>
                        <p class="text-xs italic text-slate-400">เหตุผล: ${r[6]}</p>
                    </div>
                    <div id="actions-${r[8]}">
                        ${r[7] === 'Pending' ? `
                            <button onclick="updateStatus(${r[8]}, 'Approved')" class="bg-green-500 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-green-600 transition">อนุมัติ</button>
                            <button onclick="updateStatus(${r[8]}, 'Rejected')" class="bg-red-500 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-red-600 transition ml-1">ปฏิเสธ</button>
                        ` : `
                            <span class="text-lg font-black uppercase ${r[7]==='Approved'?'text-green-500':'text-red-500'}">${r[7]}</span>
                        `}
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(rowIdx, status) {
            if (!confirm(`ยืนยันการ ${status} ใช่หรือไม่?`)) return;

            // ล็อกหน้าจอทันทีเพื่อกันเด้งกลับ
            const actionArea = document.getElementById(`actions-${rowIdx}`);
            actionArea.innerHTML = `<span class="text-indigo-600 animate-pulse font-bold text-xs uppercase">กำลังบันทึก...</span>`;

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: status })
                });

                // รอ 1.5 วินาทีเพื่อให้มั่นใจว่า Google Save เสร็จจริง แล้วค่อยโหลดข้อมูลใหม่
                setTimeout(() => {
                    fetchData();
                }, 1500);

            } catch (e) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                fetchData();
            }
        }
    </script>
</body>
</html>
