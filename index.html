<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM SKY | Next-Gen Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Sarabun:wght@400;600;700&display=swap');
        
        :root {
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-grad: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; 
            background: radial-gradient(circle at top right, #fdfcfb 0%, #e2d1c3 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #1e293b;
        }

        .page-section { display: none; }
        .active { display: block; animation: zoomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- New Pill Gradient Buttons (สไตล์ตามที่คุณต้องการ) --- */
        .choice-box {
            @apply flex items-center gap-3 p-3 px-6 rounded-full bg-white text-[13px] font-bold text-slate-500 transition-all duration-300 cursor-pointer border border-slate-100 shadow-sm relative overflow-hidden;
        }

        .choice-box i { @apply text-slate-400 transition-colors; }

        /* Hover State */
        .choice-box:hover {
            @apply border-slate-200 bg-slate-50;
            transform: translateY(-2px);
        }

        /* Checked State: ปรับสีตามหมวดหมู่แบบ Gradient */
        .choice-input:checked + .choice-box {
            @apply text-white border-transparent shadow-lg;
            background: var(--primary-grad); /* Default Gradient */
        }

        /* แยกสีตามประเภทเพื่อความสวยงาม */
        .status-pill .choice-input:checked + .choice-box { background: linear-gradient(to r, #ec4899, #f43f5e); } /* Pink-Red */
        .line-pill .choice-input:checked + .choice-box { background: linear-gradient(to r, #f59e0b, #fbbf24); } /* Orange-Yellow */
        .type-pill .choice-input:checked + .choice-box { background: linear-gradient(to r, #06b6d4, #3b82f6); } /* Blue-Cyan */

        .choice-input:checked + .choice-box i { @apply text-white; }

        /* --- Logo Animation --- */
        .logo-container {
            @apply relative w-24 h-24 mx-auto mb-6;
        }
        .logo-circle {
            @apply absolute inset-0 rounded-full animate-pulse;
            background: var(--primary-grad);
            filter: blur(15px);
            opacity: 0.3;
        }
        .logo-icon {
            @apply relative z-10 w-full h-full bg-white rounded-3xl flex items-center justify-center text-4xl text-indigo-600 shadow-2xl border border-white;
        }

        /* --- Modern Fields --- */
        .field-input {
            @apply w-full p-4 rounded-2xl border border-slate-200 bg-white/50 backdrop-blur-md outline-none transition-all text-slate-800 font-semibold focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-100;
        }

        .label-text {
            @apply text-[11px] font-extrabold uppercase tracking-widest text-slate-400 mb-3 ml-4 block;
        }

        .btn-main {
            @apply w-full py-5 rounded-full bg-slate-900 text-white font-black text-sm uppercase tracking-[0.2em] shadow-2xl hover:shadow-indigo-300 transition-all active:scale-95;
            background: linear-gradient(to r, #1e293b, #334155);
        }
    </style>
</head>
<body class="antialiased">

    <nav class="p-6 px-10 flex justify-between items-center bg-white/30 backdrop-blur-xl sticky top-0 z-50 border-b border-white/50">
        <div class="flex items-center gap-4 cursor-pointer" onclick="location.reload()">
            <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white shadow-xl rotate-3">
                <i class="fa-solid fa-bolt-lightning text-xl"></i>
            </div>
            <span class="text-2xl font-black tracking-tighter uppercase italic">HRM <span class="text-indigo-600">SKY</span></span>
        </div>
        <button id="backBtn" onclick="showPage('portal')" class="hidden text-xs font-black uppercase text-slate-500 hover:text-indigo-600 bg-white px-5 py-2 rounded-full shadow-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i> Exit
        </button>
    </nav>

    <div class="container mx-auto max-w-6xl p-6 pb-24">
        
        <div id="page-portal" class="page-section active py-20 text-center">
            <div class="logo-container">
                <div class="logo-circle"></div>
                <div class="logo-icon"><i class="fa-solid fa-paper-plane"></i></div>
            </div>
            <h1 class="text-5xl font-black text-slate-900 mb-4 tracking-tighter">Welcome to SKY</h1>
            <p class="text-slate-500 mb-16 font-medium text-lg">Modern HR Management Ecosystem</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-3xl mx-auto">
                <div onclick="showPage('employee')" class="bg-white/60 backdrop-blur-lg p-12 rounded-[4rem] border border-white shadow-2xl hover:-translate-y-3 transition-all cursor-pointer group">
                    <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-8 group-hover:scale-110 transition-transform"><i class="fa-solid fa-user-plus text-3xl"></i></div>
                    <h3 class="text-2xl font-extrabold text-slate-800">Staff Portal</h3>
                    <p class="text-slate-400 mt-3 font-medium">Create new leave request</p>
                </div>
                <div onclick="showPage('login')" class="bg-slate-900 p-12 rounded-[4rem] shadow-2xl hover:-translate-y-3 transition-all cursor-pointer group">
                    <div class="w-20 h-20 bg-slate-800 text-cyan-400 rounded-3xl flex items-center justify-center mx-auto mb-8 group-hover:rotate-12 transition-transform"><i class="fa-solid fa-key text-3xl"></i></div>
                    <h3 class="text-2xl font-extrabold text-white">Admin Hub</h3>
                    <p class="text-slate-500 mt-3 font-medium">Approval & Management</p>
                </div>
            </div>
        </div>

        <div id="page-employee" class="page-section">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                <div class="lg:col-span-7 bg-white/40 backdrop-blur-2xl p-12 rounded-[4rem] border border-white/60 shadow-2xl">
                    <div class="flex items-center gap-4 mb-12">
                        <div class="w-3 h-10 bg-indigo-500 rounded-full"></div>
                        <h2 class="text-3xl font-black text-slate-900 tracking-tight">Leave Application</h2>
                    </div>

                    <div class="space-y-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="input-group">
                                <label class="label-text">Your Name</label>
                                <input type="text" id="empName" placeholder="Full Name" class="field-input">
                            </div>
                            <div class="input-group">
                                <label class="label-text">Staff ID</label>
                                <input type="text" id="empId" placeholder="ID Number" class="field-input">
                            </div>
                        </div>

                        <div class="input-group status-pill">
                            <label class="label-text">Employment Status</label>
                            <div class="flex flex-wrap gap-4">
                                <label><input type="radio" name="empStatus" value="ประจำ" class="hidden choice-input" checked><div class="choice-box"><i class="fa-solid fa-briefcase"></i> Permanent</div></label>
                                <label><input type="radio" name="empStatus" value="ชั่วคราว" class="hidden choice-input"><div class="choice-box"><i class="fa-solid fa-clock"></i> Contract</div></label>
                            </div>
                        </div>

                        <div class="input-group line-pill">
                            <label class="label-text">Production Line</label>
                            <div class="flex flex-wrap gap-3">
                                <label><input type="radio" name="empLine" value="C" class="hidden choice-input" checked><div class="choice-box">Line C</div></label>
                                <label><input type="radio" name="empLine" value="E" class="hidden choice-input"><div class="choice-box">Line E</div></label>
                                <label><input type="radio" name="empLine" value="F" class="hidden choice-input"><div class="choice-box">Line F</div></label>
                                <label><input type="radio" name="empLine" value="Office" class="hidden choice-input"><div class="choice-box">Office</div></label>
                                <label><input type="radio" name="empLine" value="TC" class="hidden choice-input"><div class="choice-box">Line TC</div></label>
                            </div>
                        </div>

                        <div class="input-group type-pill">
                            <label class="label-text">Type of Leave</label>
                            <div class="flex flex-wrap gap-3">
                                <label><input type="radio" name="leaveType" value="ลาป่วย" class="hidden choice-input" checked><div class="choice-box"><i class="fa-solid fa-Stethoscope"></i> Sick Leave</div></label>
                                <label><input type="radio" name="leaveType" value="ลากิจ" class="hidden choice-input"><div class="choice-box"><i class="fa-solid fa-calendar-check"></i> Personal</div></label>
                                <label><input type="radio" name="leaveType" value="ลาพักร้อน" class="hidden choice-input"><div class="choice-box"><i class="fa-solid fa-sun"></i> Vacation</div></label>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-6">
                            <div class="input-group">
                                <label class="label-text">Start</label>
                                <input type="date" id="dateStart" class="field-input">
                            </div>
                            <div class="input-group">
                                <label class="label-text">End</label>
                                <input type="date" id="dateEnd" class="field-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Reason & Details</label>
                            <textarea id="leaveReason" placeholder="Write something..." class="field-input h-32 resize-none"></textarea>
                        </div>

                        <button onclick="submitLeave()" id="submitBtn" class="btn-main">Submit Application</button>
                    </div>
                </div>

                <div class="lg:col-span-5">
                    <div class="flex items-center justify-between mb-8 px-6">
                        <h3 class="text-xl font-black text-slate-800">Timeline</h3>
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-ping"></div>
                    </div>
                    <div id="empList" class="space-y-4 overflow-y-auto max-h-[800px] no-scrollbar px-2"></div>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section">
            <div class="max-w-md mx-auto mt-24 bg-white p-12 rounded-[4rem] shadow-2xl text-center border border-white">
                <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-10 shadow-inner"><i class="fa-solid fa-fingerprint text-4xl"></i></div>
                <h3 class="text-3xl font-black mb-8">Access Key</h3>
                <input type="password" id="adminPass" placeholder="••••" class="field-input text-center text-4xl tracking-[0.6em] mb-10">
                <button onclick="checkLogin()" class="btn-main">Verify identity</button>
            </div>
        </div>

        <div id="page-approver" class="page-section">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <h2 class="text-4xl font-black text-slate-900 tracking-tighter">Approvals Feed</h2>
                    <div id="roleBadge" class="mt-4 px-6 py-2 bg-indigo-600 text-white text-[11px] font-black rounded-full uppercase tracking-widest shadow-lg shadow-indigo-200 inline-block"></div>
                </div>
                <button onclick="fetchData()" class="p-4 bg-white rounded-full text-indigo-600 shadow-xl hover:rotate-180 transition-all duration-500"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </div>

    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwY6mRSha_DXHVR9umv4qTg1bDo8g3fqVq9yvwJakBuVEdayGRinSKPzA8zdivWapFR/exec'; 

        let currentRole = "";
        let rawData = [];

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('backBtn').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'approver') fetchData();
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            const roles = {'7843':'Assy','1332':'Elec','80006':'Pack','7605':'Sup','9764':'Manager'};
            if(roles[pass]) { currentRole = roles[pass]; document.getElementById('roleBadge').innerText = "Access Level: " + currentRole; showPage('approver'); }
            else alert('Invalid Key');
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const data = {
                action: 'addLeave',
                NAME: document.getElementById('empName').value,
                ID: document.getElementById('empId').value,
                EMP_STATUS: document.querySelector('input[name="empStatus"]:checked').value,
                LEAVE_TYPE: document.querySelector('input[name="leaveType"]:checked').value,
                LINE: document.querySelector('input[name="empLine"]:checked').value,
                PROCESS: "Standard",
                START: document.getElementById('dateStart').value,
                END: document.getElementById('dateEnd').value,
                REASON: document.getElementById('leaveReason').value || '-',
                FILE: null
            };

            if(!data.NAME || !data.ID) return alert('Fill required fields');
            btn.disabled = true; btn.innerText = "Encrypting...";

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => { alert('Application Sent Successfully'); location.reload(); })
            .catch(() => alert('Network Error'));
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL);
                rawData = await res.json();
                renderUI();
            } catch (err) { console.error("Sync Error"); }
        }

        function renderUI() {
            const empArea = document.getElementById('empList');
            const managerArea = document.getElementById('managerList');
            const rows = rawData.slice().reverse();

            empArea.innerHTML = rows.map(r => `
                <div class="bg-white/70 backdrop-blur-sm p-6 rounded-[2.5rem] flex justify-between items-center shadow-sm border border-white">
                    <div>
                        <div class="font-extrabold text-slate-800">${r[0]} <span class="text-[10px] text-slate-400 ml-2">#${r[1]}</span></div>
                        <div class="text-[10px] font-bold text-indigo-500 uppercase mt-1">${r[3]} • Line ${r[9]}</div>
                    </div>
                    <div class="px-5 py-2 rounded-full text-[9px] font-black uppercase tracking-widest ${r[7]==='Approved'?'bg-green-500 text-white shadow-lg shadow-green-100':'bg-amber-100 text-amber-700'}">
                        ${r[7]}
                    </div>
                </div>`).join('');

            const filtered = rows.filter(r => r[7] === 'Pending');
            managerArea.innerHTML = filtered.map(r => `
                <div class="bg-white p-10 rounded-[4rem] shadow-2xl relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-50 rounded-full -mr-10 -mt-10 transition-transform group-hover:scale-150"></div>
                    <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">${r[3]}</span>
                    <h4 class="text-3xl font-black text-slate-900 mt-2">${r[0]}</h4>
                    <p class="text-xs font-bold text-slate-400 mt-1">DEPARTMENT: ${r[10]} • LINE: ${r[9]}</p>
                    <div class="my-8 p-6 bg-slate-50 rounded-[2rem] text-sm italic text-slate-600 border border-slate-100 shadow-inner">"${r[6]}"</div>
                    <div class="flex gap-4">
                        <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-1 bg-indigo-600 text-white py-5 rounded-full font-black text-xs uppercase tracking-widest shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all">Authorize</button>
                        <button onclick="updateStatus(${r[16]}, 'Rejected')" class="flex-1 bg-slate-100 text-slate-500 py-5 rounded-full font-black text-xs uppercase tracking-widest hover:bg-rose-50 hover:text-rose-600 transition-all">Decline</button>
                    </div>
                </div>`).join('');
            
            if(filtered.length === 0) managerArea.innerHTML = "<div class='col-span-full py-20 text-center opacity-30'><i class='fa-solid fa-couch text-6xl mb-6'></i><p class='font-black uppercase tracking-[0.3em]'>Everything Clear</p></div>";
        }

        async function updateStatus(rowIdx, newStatus) {
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) })
            .then(() => fetchData());
        }
    </script>
</body>
</html>
