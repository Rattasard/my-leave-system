<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Leave Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-section { display: none; }
        .active { display: block; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 p-5">
    <div id="page-employee" class="page-section active max-w-lg mx-auto glass-card p-8 rounded-3xl">
        <h2 class="text-2xl font-bold mb-6">Leave Application</h2>
        <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="w-full p-3 mb-3 border rounded-xl">
        <input type="text" id="empId" placeholder="รหัสพนักงาน" class="w-full p-3 mb-3 border rounded-xl">
        <select id="leaveType" class="w-full p-3 mb-3 border rounded-xl">
            <option>ลาป่วย</option><option>ลากิจ</option>
        </select>
        <input type="date" id="dateStart" class="w-full p-3 mb-3 border rounded-xl">
        <input type="date" id="dateEnd" class="w-full p-3 mb-3 border rounded-xl">
        <textarea id="leaveReason" placeholder="เหตุผล" class="w-full p-3 mb-3 border rounded-xl"></textarea>
        
        <label class="block text-xs font-bold text-slate-400 mb-2">แนบใบรับรองแพทย์ (ถ้ามี)</label>
        <input type="file" id="fileUpload" accept="image/*" class="w-full mb-6 text-sm">
        
        <button id="submitBtn" onclick="submitLeave()" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold">Submit</button>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxXAkv4y5L_yr_01p7oPXL3KS2jxnCEWpXmaRLkb-UB_ZhdRlnYQ9iERCiD9Fn06mwM/exec';

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('fileUpload');
            
            let fileData = "";
            let fileName = "";
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileName = file.name;
                fileData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            const data = {
                action: 'addLeave',
                name: document.getElementById('empName').value,
                empId: document.getElementById('empId').value,
                empStatus: 'พนักงาน',
                leaveType: document.getElementById('leaveType').value,
                start: document.getElementById('dateStart').value,
                end: document.getElementById('dateEnd').value,
                reason: document.getElementById('leaveReason').value,
                fileData: fileData,
                fileName: fileName
            };

            btn.disabled = true;
            btn.innerText = 'กำลังส่ง...';
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            alert('ส่งคำร้องสำเร็จ');
            window.location.reload();
        }
    </script>
</body>
</html>
