<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM SKY | Warm Minimalist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap');
        
        :root {
            --bg-warm: #FDFBF8; /* สีพื้นหลังขาวอมครีม อบอุ่น สบายตา */
            --text-main: #5C534A; /* สีตัวอักษรน้ำตาลเทา ลดความเข้มของสีดำ */
            --border-soft: #F0EBE1;
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; 
            background-color: var(--bg-warm);
            color: var(--text-main);
            min-height: 100vh;
            transition: all 0.4s ease;
        }

        /* --- Input Fields --- */
        .input-warm {
            @apply w-full p-4 px-7 rounded-[2rem] outline-none transition-all duration-300 text-[15px] font-medium shadow-sm;
            background-color: #FFFFFF;
            border: 1.5px solid var(--border-soft);
            color: var(--text-main);
        }
        .input-warm:focus {
            border-color: #FCA5A5;
            box-shadow: 0 0 0 4px rgba(252, 165, 165, 0.15);
        }
        .input-warm::placeholder { color: #C4BDB6; }

        /* --- Gradient Pill Buttons (Inspired by image_c98f0a.png) --- */
        .pill-btn {
            @apply flex items-center justify-center gap-2.5 px-7 py-3.5 rounded-full text-[14px] font-bold transition-all duration-300 cursor-pointer;
            background-color: #F5F2EB; /* สีปุ่มตอนยังไม่เลือก */
            color: #A8A096;
            border: 1px solid transparent;
        }
        .pill-btn i { @apply text-lg; }
        
        .pill-btn:hover {
            background-color: #EFEBE2;
            color: #8C837A;
        }

        /* Active State (ไล่สี Gradient โทนอบอุ่น) */
        .choice-radio:checked + .pill-btn {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            background: linear-gradient(to right, #fb923c, #f43f5e); /* Warm Orange to Soft Rose */
            color: white;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.35);
            transform: translateY(-2px);
            border-color: transparent;
        }

        /* --- History Card --- */
        .card-warm {
            @apply bg-white p-6 rounded-[2.5rem] flex justify-between items-center mb-5 transition-all duration-300 cursor-default;
            border: 1px solid var(--border-soft);
            box-shadow: 0 8px 30px -10px rgba(180, 170, 160, 0.15);
        }
        .card-warm:hover {
            transform: translateX(-4px);
            box-shadow: 0 12px 35px -10px rgba(244, 63, 94, 0.15);
            border-color: rgba(244, 63, 94, 0.1);
        }

        .label-warm {
            @apply text-[11px] font-extrabold uppercase tracking-[0.2em] text-[#B8B0A8] mb-3 ml-6 block;
        }

        /* --- View Controller --- */
        .view-section { display: none; }
        .view-active { display: block; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="p-6 px-8 md:px-12 flex justify-between items-center sticky top-0 z-50 bg-[#FDFBF8]/80 backdrop-blur-xl border-b border-[#F0EBE1]">
        <div class="flex items-center gap-4 cursor-pointer" onclick="showView('portal')">
            <div class="w-12 h-12 bg-gradient-to-tr from-orange-400 to-rose-400 rounded-[1.2rem] flex items-center justify-center text-white text-xl shadow-lg shadow-rose-200">
                <i class="fa-solid fa-sun"></i>
            </div>
            <span class="text-2xl font-black tracking-tight uppercase text-[#5C534A]">HRM <span class="text-rose-400">SKY</span></span>
        </div>
        <div id="navActions" class="hidden">
            <button onclick="showView('portal')" class="px-6 py-2.5 rounded-full bg-white border border-[#F0EBE1] text-[#8C837A] text-[11px] font-bold uppercase tracking-widest hover:text-rose-500 shadow-sm transition-all">
                <i class="fa-solid fa-arrow-left mr-2"></i> Home
            </button>
        </div>
    </nav>

    <div class="container mx-auto max-w-7xl p-6 pt-10">

        <div id="view-portal" class="view-section view-active py-16 md:py-24 text-center">
            <div class="inline-flex items-center gap-2 px-5 py-2 bg-orange-50 rounded-full border border-orange-100 mb-8">
                <span class="w-2 h-2 bg-orange-400 rounded-full animate-pulse"></span>
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-orange-600">Warm & Minimal</span>
            </div>
            <h1 class="text-6xl md:text-7xl font-black text-[#4A423A] mb-6 tracking-tighter">Welcome to <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-400">Your Workspace.</span></h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto mt-20">
                <div onclick="showView('employee')" class="bg-white p-14 rounded-[3.5rem] group cursor-pointer transition-all hover:-translate-y-3 shadow-xl shadow-orange-900/5 border border-[#F0EBE1]">
                    <div class="w-20 h-20 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-8 group-hover:scale-110 transition-transform duration-500"><i class="fa-solid fa-user-pen text-3xl"></i></div>
                    <h3 class="text-3xl font-black text-[#5C534A]">Employee</h3>
                    <p class="text-[#A8A096] mt-3 font-medium">สำหรับพนักงาน ส่งคำขอลา</p>
                </div>
                <div onclick="showView('login')" class="bg-gradient-to-br from-[#4A423A] to-[#362E29] p-14 rounded-[3.5rem] group cursor-pointer transition-all hover:-translate-y-3 shadow-xl shadow-black/10">
                    <div class="w-20 h-20 bg-white/10 text-orange-300 rounded-full flex items-center justify-center mx-auto mb-8 group-hover:scale-110 transition-transform duration-500"><i class="fa-solid fa-unlock-keyhole text-3xl"></i></div>
                    <h3 class="text-3xl font-black text-white">Manager</h3>
                    <p class="text-white/60 mt-3 font-medium">สำหรับผู้อนุมัติ (Authorize)</p>
                </div>
            </div>
        </div>

        <div id="view-employee" class="view-section">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 md:gap-14">
                
                <div class="lg:col-span-7 bg-white p-8 md:p-14 rounded-[4rem] border border-[#F0EBE1] shadow-2xl shadow-orange-900/5">
                    <div class="flex items-center gap-4 mb-12">
                        <div class="w-2 h-10 bg-rose-400 rounded-full"></div>
                        <h2 class="text-4xl font-black text-[#4A423A] tracking-tight">Leave Request</h2>
                    </div>

                    <div class="space-y-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div><label class="label-warm">Full Name / ชื่อ-นามสกุล</label><input type="text" id="empName" placeholder="ระบุชื่อ..." class="input-warm"></div>
                            <div><label class="label-warm">Staff ID / รหัสพนักงาน</label><input type="text" id="empId" placeholder="ID-0000" class="input-warm"></div>
                        </div>

                        <div>
                            <label class="label-warm">Employment Status</label>
                            <div class="flex flex-wrap gap-4">
                                <label><input type="radio" name="empStatus" value="ประจำ" class="hidden choice-radio" checked><div class="pill-btn"><i class="fa-solid fa-briefcase"></i> Permanent</div></label>
                                <label><input type="radio" name="empStatus" value="ชั่วคราว" class="hidden choice-radio"><div class="pill-btn"><i class="fa-solid fa-file-contract"></i> Contract</div></label>
                            </div>
                        </div>

                        <div>
                            <label class="label-warm">Production Line</label>
                            <div class="flex flex-wrap gap-3">
                                <label><input type="radio" name="empLine" value="Line C" class="hidden choice-radio" checked><div class="pill-btn"><i class="fa-solid fa-layer-group"></i> Line C</div></label>
                                <label><input type="radio" name="empLine" value="Line E" class="hidden choice-radio"><div class="pill-btn"><i class="fa-solid fa-layer-group"></i> Line E</div></label>
                                <label><input type="radio" name="empLine" value="Line F" class="hidden choice-radio"><div class="pill-btn"><i class="fa-solid fa-layer-group"></i> Line F</div></label>
                                <label><input type="radio" name="empLine" value="Office" class="hidden choice-radio"><div class="pill-btn"><i class="fa-solid fa-building"></i> Office</div></label>
                                <label><input type="radio" name="empLine" value="Common" class="hidden choice-radio"><div class="pill-btn"><i class="fa-solid fa-users"></i> Common</div></label>
                            </div>
                        </div>

                        <div>
                            <label class="label-warm">Leave Category</label>
                            <div class="flex flex-wrap gap-4">
                                <label><input type="radio" name="leaveType" value="ลาป่วย" class="hidden choice-radio" checked><div class="pill-btn"><i class="fa-solid fa-notes-medical"></i> Sick Leave</div></label>
                                <label><input type="radio" name="leaveType" value="ลากิจ" class="hidden choice-radio"><div class="pill-btn"><i class="fa-solid fa-user-clock"></i> Personal</div></label>
                                <label><input type="radio" name="leaveType" value="ลาพักร้อน" class="hidden choice-radio"><div class="pill-btn"><i class="fa-solid fa-plane-departure"></i> Vacation</div></label>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-8">
                            <div><label class="label-warm">Start Date</label><input type="date" id="dateStart" class="input-warm"></div>
                            <div><label class="label-warm">End Date</label><input type="date" id="dateEnd" class="input-warm"></div>
                        </div>

                        <div><label class="label-warm">Reason / เหตุผล</label><textarea id="leaveReason" placeholder="ระบุเหตุผลการลา..." class="input-warm h-36 resize-none py-6"></textarea></div>

                        <button onclick="submitLeave()" id="submitBtn" class="w-full py-6 rounded-full bg-gradient-to-r from-orange-400 to-rose-400 text-white font-black text-sm uppercase tracking-[0.3em] shadow-xl shadow-rose-200 hover:shadow-2xl hover:-translate-y-1 transition-all active:scale-95 mt-4">
                            Send Request <i class="fa-solid fa-paper-plane ml-2"></i>
                        </button>
                    </div>
                </div>

                <div class="lg:col-span-5">
                    <div class="flex items-center justify-between mb-8 px-6">
                        <h3 class="text-2xl font-black text-[#4A423A] tracking-tight">Recent Status</h3>
                        <div class="flex items-center gap-2 bg-emerald-50 px-4 py-2 rounded-full border border-emerald-100">
                            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>
                            <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Live Updates</span>
                        </div>
                    </div>
                    
                    <div id="historyList" class="space-y-4 overflow-y-auto max-h-[850px] no-scrollbar px-2 pb-20">
                        </div>

                    <div class="mt-8 p-10 rounded-[3rem] bg-gradient-to-tr from-orange-50 to-rose-50 border border-rose-100 flex items-center justify-between shadow-inner">
                        <div>
                            <p class="text-[11px] font-black uppercase tracking-widest text-rose-400 mb-1">Vacation Balance</p>
                            <p class="text-3xl font-black text-[#5C534A]">12 <span class="text-sm font-medium text-[#A8A096]">Days</span></p>
                        </div>
                        <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center text-rose-300 shadow-md"><i class="fa-solid fa-calendar-check text-2xl"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-login" class="view-section">
            <div class="max-w-md mx-auto mt-24 bg-white p-14 rounded-[4rem] text-center shadow-2xl shadow-orange-900/5 border border-[#F0EBE1]">
                <div class="w-24 h-24 bg-orange-50 text-orange-400 rounded-full flex items-center justify-center mx-auto mb-8"><i class="fa-solid fa-shield-halved text-4xl"></i></div>
                <h3 class="text-3xl font-black mb-8 text-[#4A423A]">Manager Access</h3>
                <input type="password" id="adminPass" placeholder="PIN" class="input-warm text-center text-3xl tracking-[0.5em] mb-10 py-5 bg-orange-50/50">
                <button onclick="checkLogin()" class="w-full py-5 rounded-full bg-[#4A423A] text-white font-black text-sm uppercase tracking-[0.2em] shadow-xl hover:bg-rose-500 transition-all">Verify Key</button>
            </div>
        </div>

        <div id="view-manager" class="view-section">
            <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
                <div>
                    <h2 class="text-5xl md:text-6xl font-black text-[#4A423A] tracking-tighter">Review Desk</h2>
                    <div id="roleBadge" class="mt-5 px-6 py-2 bg-orange-100 text-orange-600 text-[11px] font-black rounded-full uppercase tracking-widest inline-flex items-center gap-2 border border-orange-200"><i class="fa-solid fa-user-tie"></i></div>
                </div>
                <button onclick="fetchData()" class="w-16 h-16 bg-white rounded-full text-rose-400 border border-[#F0EBE1] shadow-xl hover:rotate-180 transition-all duration-700 flex items-center justify-center"><i class="fa-solid fa-arrows-rotate text-xl"></i></button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </div>

    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwY6mRSha_DXHVR9umv4qTg1bDo8g3fqVq9yvwJakBuVEdayGRinSKPzA8zdivWapFR/exec';
        let currentRole = "";
        let rawData = [];

        function showView(id) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            document.getElementById('navActions').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'manager') fetchData();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            const roles = {'7843':'Assy','1332':'Elec','80006':'Pack','7605':'Sup','9764':'Manager'};
            if(roles[pass]) { 
                currentRole = roles[pass]; 
                document.getElementById('roleBadge').innerHTML = `<i class="fa-solid fa-user-tie"></i> Access: ${currentRole}`; 
                showView('manager'); 
            } else { 
                alert('รหัสผ่านไม่ถูกต้อง'); 
            }
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const data = {
                action: 'addLeave',
                NAME: document.getElementById('empName').value,
                ID: document.getElementById('empId').value,
                EMP_STATUS: document.querySelector('input[name="empStatus"]:checked').value,
                LEAVE_TYPE: document.querySelector('input[name="leaveType"]:checked').value,
                LINE: document.querySelector('input[name="empLine"]:checked').value,
                PROCESS: "COMMON",
                START: document.getElementById('dateStart').value,
                END: document.getElementById('dateEnd').value,
                REASON: document.getElementById('leaveReason').value || '-',
                FILE: null
            };

            if(!data.NAME || !data.ID) return alert('กรุณากรอกชื่อและรหัสพนักงานให้ครบถ้วน');
            
            btn.disabled = true; 
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => { alert('ส่งคำขอสำเร็จ!'); location.reload(); })
            .catch(() => { alert('เกิดข้อผิดพลาดในการเชื่อมต่อ'); btn.disabled = false; btn.innerHTML = 'Send Request <i class="fa-solid fa-paper-plane ml-2"></i>'; });
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL);
                rawData = await res.json();
                renderUI();
            } catch (err) { console.error("API Sync Error"); }
        }

        function renderUI() {
            const histArea = document.getElementById('historyList');
            const managerArea = document.getElementById('managerList');
            
            // Fallback UI incase of no data or loading
            if(rawData.length === 0) {
                histArea.innerHTML = `<div class="text-center py-10 text-[#A8A096] text-sm"><i class="fa-solid fa-inbox text-3xl mb-3 block"></i> No recent records</div>`;
                managerArea.innerHTML = `<div class="col-span-full py-20 text-center text-[#A8A096]"><i class="fa-solid fa-mug-hot text-6xl mb-6 block"></i><p class="font-bold tracking-widest uppercase">All clear, no pending requests.</p></div>`;
                return;
            }

            const sorted = rawData.slice().reverse();

            // Render Employee History
            histArea.innerHTML = sorted.map(r => {
                const isApprove = r[7] === 'Approved';
                return `
                <div class="card-warm">
                    <div>
                        <div class="text-[17px] font-black text-[#5C534A] tracking-tight">${r[0]}</div>
                        <div class="text-[11px] font-bold text-[#A8A096] uppercase mt-1.5 tracking-widest flex items-center gap-2">
                            <span class="text-rose-400"><i class="fa-solid fa-tag"></i></span> ${r[3]} • ${r[9]}
                        </div>
                    </div>
                    <div class="px-5 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest ${isApprove ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 'bg-orange-50 text-orange-600 border border-orange-100'}">
                        ${r[7]}
                    </div>
                </div>`
            }).join('');

            // Render Manager Review Cards
            const pending = sorted.filter(r => r[7] === 'Pending');
            managerArea.innerHTML = pending.map(r => `
                <div class="bg-white p-10 md:p-12 rounded-[3.5rem] border border-[#F0EBE1] shadow-xl shadow-orange-900/5 relative overflow-hidden group">
                    <div class="absolute -right-8 -top-8 w-32 h-32 bg-gradient-to-tr from-orange-50 to-rose-50 rounded-full blur-2xl"></div>
                    
                    <div class="relative z-10">
                        <span class="text-[10px] font-black text-rose-400 uppercase tracking-widest bg-rose-50 px-4 py-1.5 rounded-full border border-rose-100">${r[3]} Request</span>
                        <h4 class="text-3xl font-black text-[#4A423A] mt-5">${r[0]}</h4>
                        <p class="text-xs font-bold text-[#A8A096] mt-2 uppercase tracking-wide">ID: ${r[1]} • Line: ${r[9]}</p>
                        
                        <div class="my-8 p-8 bg-[#FDFBF8] rounded-[2.5rem] text-[#8C837A] border border-[#F0EBE1] font-medium italic">
                            <i class="fa-solid fa-quote-left text-orange-200 mr-2 text-xl"></i> ${r[6]}
                        </div>
                        
                        <div class="flex gap-4">
                            <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-grow bg-gradient-to-r from-emerald-400 to-emerald-500 text-white py-5 rounded-full font-black text-[12px] uppercase tracking-[0.2em] shadow-lg shadow-emerald-200 hover:-translate-y-1 transition-all"><i class="fa-solid fa-check mr-1"></i> Approve</button>
                            <button onclick="updateStatus(${r[16]}, 'Rejected')" class="px-8 bg-white text-[#A8A096] py-5 rounded-full font-black text-[12px] uppercase tracking-widest border border-[#F0EBE1] hover:text-rose-500 hover:bg-rose-50 transition-all"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>`).join('');
            
            if(pending.length === 0) managerArea.innerHTML = `<div class="col-span-full py-20 text-center text-[#A8A096]"><i class="fa-solid fa-mug-hot text-6xl mb-6 block text-orange-200"></i><p class="font-bold tracking-widest uppercase">Inbox Zero</p></div>`;
        }

        async function updateStatus(rowIdx, newStatus) {
            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) 
            }).then(() => fetchData());
        }
    </script>
</body>
</html>
