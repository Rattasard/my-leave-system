<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM SKY | Luxury Cloud Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #1e293b; /* Deep Navy */
            --accent: #4f46e5;  /* Royal Indigo */
            --bg-muted: #f1f5f9;
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; 
            background: #f8fafc;
            color: #334155;
            transition: all 0.5s ease;
        }

        .section-view { display: none; }
        .active-view { display: block; animation: viewIn 0.6s cubic-bezier(0.23, 1, 0.32, 1); }

        @keyframes viewIn {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- Input Styling (Ultra-Rounded & Clean) --- */
        .input-luxe {
            @apply w-full p-4 px-8 rounded-[2.5rem] border border-slate-200 bg-white/80 outline-none transition-all duration-300 text-[15px] font-medium text-slate-700 shadow-sm;
        }
        .input-luxe:focus {
            @apply border-indigo-500 bg-white shadow-md;
        }

        /* --- Choice Buttons (No Glow, Just Solid Presence) --- */
        .btn-pill {
            @apply flex items-center justify-center gap-3 p-3.5 px-8 rounded-full bg-white text-[14px] font-bold text-slate-400 transition-all cursor-pointer border border-slate-100 shadow-sm;
        }
        .choice-radio:checked + .btn-pill {
            @apply bg-slate-900 text-white border-slate-900 shadow-lg;
            transform: translateY(-2px);
        }

        /* --- Card Styles (Inspired by image_c91d92.jpg) --- */
        .card-luxe {
            @apply bg-white p-6 rounded-[3rem] border border-slate-50 shadow-[0_10px_40px_-15px_rgba(0,0,0,0.05)] flex justify-between items-center transition-all;
        }
        .card-luxe:hover {
            @apply shadow-xl -translate-x-2;
        }

        .label-luxe {
            @apply text-[11px] font-extrabold uppercase tracking-[0.25em] text-slate-400 mb-4 ml-10 block;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="p-8 px-12 flex justify-between items-center sticky top-0 z-50 bg-white/40 backdrop-blur-2xl border-b border-white/20">
        <div class="flex items-center gap-4 cursor-pointer" onclick="location.reload()">
            <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white text-xl shadow-2xl rotate-3">
                <i class="fa-solid fa-compass-drafting"></i>
            </div>
            <span class="text-2xl font-black tracking-tighter uppercase italic text-slate-900">HRM <span class="text-indigo-600">SKY</span></span>
        </div>
        <button id="exitBtn" onclick="showView('portal')" class="hidden px-8 py-3 rounded-full bg-slate-900 text-white text-[10px] font-black uppercase tracking-widest hover:bg-rose-600 transition-all shadow-xl">
            <i class="fa-solid fa-power-off mr-2"></i> Close System
        </button>
    </nav>

    <div class="container mx-auto max-w-7xl p-6 pt-12">
        
        <div id="view-portal" class="section-view active-view py-20 text-center">
            <div class="mb-6 inline-flex items-center gap-3 px-6 py-2 bg-indigo-50 rounded-full border border-indigo-100">
                <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                <span class="text-[10px] font-black uppercase tracking-widest text-indigo-600">Unified HR Operations 2026</span>
            </div>
            <h1 class="text-8xl font-black text-slate-900 mb-10 tracking-tighter leading-tight">Efficiency, <br><span class="text-indigo-600">Simplified.</span></h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-4xl mx-auto mt-20">
                <div onclick="showView('employee')" class="group bg-white p-16 rounded-[4rem] shadow-2xl hover:-translate-y-4 transition-all cursor-pointer border border-slate-50">
                    <div class="w-24 h-24 bg-slate-50 text-slate-900 rounded-[2.5rem] flex items-center justify-center mx-auto mb-10 group-hover:bg-indigo-600 group-hover:text-white transition-all shadow-inner"><i class="fa-solid fa-user-tie text-4xl"></i></div>
                    <h3 class="text-4xl font-black text-slate-900">Employee</h3>
                    <p class="text-slate-400 mt-4 font-medium italic">สำหรับพนักงาน ส่งคำขอและดูประวัติ</p>
                </div>
                <div onclick="showView('login')" class="group bg-slate-900 p-16 rounded-[4rem] shadow-2xl hover:-translate-y-4 transition-all cursor-pointer">
                    <div class="w-24 h-24 bg-slate-800 text-indigo-400 rounded-[2.5rem] flex items-center justify-center mx-auto mb-10"><i class="fa-solid fa-fingerprint text-4xl"></i></div>
                    <h3 class="text-4xl font-black text-white">Manager</h3>
                    <p class="text-slate-500 mt-4 font-medium italic">สำหรับผู้อนุมัติและฝ่ายบริหาร</p>
                </div>
            </div>
        </div>

        <div id="view-employee" class="section-view">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <div class="lg:col-span-7 bg-white p-12 md:p-16 rounded-[4.5rem] border border-slate-50 shadow-sm relative overflow-hidden">
                    <div class="flex items-center gap-4 mb-14">
                        <div class="w-3 h-10 bg-indigo-600 rounded-full"></div>
                        <h2 class="text-4xl font-black text-slate-900 tracking-tighter italic">Application Form</h2>
                    </div>

                    <div class="space-y-12">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div><label class="label-luxe">Full Name / ชื่อ-นามสกุล</label><input type="text" id="empName" placeholder="John Doe" class="input-luxe"></div>
                            <div><label class="label-luxe">Staff ID / รหัสพนักงาน</label><input type="text" id="empId" placeholder="EMP-001" class="input-luxe"></div>
                        </div>

                        <div>
                            <label class="label-luxe">Employment Status</label>
                            <div class="flex flex-wrap gap-4">
                                <label><input type="radio" name="empStatus" value="ประจำ" class="hidden choice-radio" checked><div class="btn-pill">Permanent</div></label>
                                <label><input type="radio" name="empStatus" value="ชั่วคราว" class="hidden choice-radio"><div class="btn-pill">Contract</div></label>
                            </div>
                        </div>

                        <div>
                            <label class="label-luxe">Production Line</label>
                            <div class="flex flex-wrap gap-3">
                                <label><input type="radio" name="empLine" value="Line C" class="hidden choice-radio" checked><div class="btn-pill">Line C</div></label>
                                <label><input type="radio" name="empLine" value="Line E" class="hidden choice-radio"><div class="btn-pill">Line E</div></label>
                                <label><input type="radio" name="empLine" value="Line F" class="hidden choice-radio"><div class="btn-pill">Line F</div></label>
                                <label><input type="radio" name="empLine" value="Office" class="hidden choice-radio"><div class="btn-pill">Office</div></label>
                                <label><input type="radio" name="empLine" value="Line TC" class="hidden choice-radio"><div class="btn-pill">Line TC</div></label>
                            </div>
                        </div>

                        <div>
                            <label class="label-luxe">Request Type</label>
                            <div class="flex flex-wrap gap-4">
                                <label><input type="radio" name="leaveType" value="ลาป่วย" class="hidden choice-radio" checked><div class="btn-pill"><i class="fa-solid fa-briefcase-medical"></i> Sick</div></label>
                                <label><input type="radio" name="leaveType" value="ลากิจ" class="hidden choice-radio"><div class="btn-pill"><i class="fa-solid fa-user-clock"></i> Personal</div></label>
                                <label><input type="radio" name="leaveType" value="ลาพักร้อน" class="hidden choice-radio"><div class="btn-pill"><i class="fa-solid fa-plane-departure"></i> Vacation</div></label>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-10">
                            <div><label class="label-luxe">Start Date</label><input type="date" id="dateStart" class="input-luxe"></div>
                            <div><label class="label-luxe">End Date</label><input type="date" id="dateEnd" class="input-luxe"></div>
                        </div>

                        <div><label class="label-luxe">Reason Details / ระบุเหตุผล</label><textarea id="leaveReason" placeholder="Enter reason for leave..." class="input-luxe h-40 resize-none py-6"></textarea></div>

                        <button onclick="submitLeave()" id="submitBtn" class="w-full py-7 rounded-full bg-slate-900 text-white font-black text-sm uppercase tracking-[0.4em] shadow-2xl hover:bg-indigo-600 transition-all active:scale-95">Send Request</button>
                    </div>
                </div>

                <div class="lg:col-span-5">
                    <div class="flex items-center justify-between mb-10 px-8">
                        <h3 class="text-2xl font-black text-slate-800 tracking-tight italic">Live Status</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Auto Refresh</span>
                            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
                        </div>
                    </div>
                    <div id="historyList" class="space-y-6 overflow-y-auto max-h-[1000px] no-scrollbar px-2 pb-20">
                        </div>
                </div>
            </div>
        </div>

        <div id="view-login" class="section-view">
            <div class="max-w-md mx-auto mt-20 bg-white p-16 rounded-[4.5rem] text-center shadow-2xl border border-slate-50">
                <div class="w-24 h-24 bg-slate-900 text-white rounded-[2rem] flex items-center justify-center mx-auto mb-10 shadow-2xl"><i class="fa-solid fa-shield-halved text-4xl"></i></div>
                <h3 class="text-3xl font-black mb-10 text-slate-900">Authorize Hub</h3>
                <input type="password" id="adminPass" placeholder="••••" class="input-luxe text-center text-4xl tracking-[0.8em] mb-12 bg-slate-50">
                <button onclick="checkLogin()" class="w-full py-6 rounded-full bg-slate-900 text-white font-black text-sm uppercase tracking-widest shadow-2xl hover:bg-indigo-600 transition-all">Verify Access</button>
            </div>
        </div>

        <div id="view-manager" class="section-view">
            <div class="flex flex-col md:flex-row justify-between items-end mb-20 gap-8">
                <div>
                    <h2 class="text-7xl font-black text-slate-900 tracking-tighter">Control Hub</h2>
                    <div id="roleLabel" class="mt-4 px-10 py-3 bg-indigo-600 text-white text-[11px] font-black rounded-full uppercase tracking-widest inline-block shadow-2xl"></div>
                </div>
                <button onclick="fetchData()" class="w-20 h-20 bg-white rounded-full text-indigo-600 shadow-xl hover:rotate-180 transition-all duration-700 flex items-center justify-center border border-slate-100"><i class="fa-solid fa-arrows-rotate text-2xl"></i></button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-10"></div>
        </div>

    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwY6mRSha_DXHVR9umv4qTg1bDo8g3fqVq9yvwJakBuVEdayGRinSKPzA8zdivWapFR/exec'; 
        let currentRole = "";
        let dataStore = [];

        function showView(id) {
            document.querySelectorAll('.section-view').forEach(v => v.classList.remove('active-view'));
            document.getElementById('view-' + id).classList.add('active-view');
            document.getElementById('exitBtn').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'manager') fetchData();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            const roles = {'7843':'Assy','1332':'Elec','80006':'Pack','7605':'Sup','9764':'Manager'};
            if(roles[pass]) { 
                currentRole = roles[pass]; 
                document.getElementById('roleLabel').innerText = "Security Context: " + currentRole; 
                showView('manager'); 
            } else { alert('Access Denied: Invalid Security Key'); }
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const data = {
                action: 'addLeave',
                NAME: document.getElementById('empName').value,
                ID: document.getElementById('empId').value,
                EMP_STATUS: document.querySelector('input[name="empStatus"]:checked').value,
                LEAVE_TYPE: document.querySelector('input[name="leaveType"]:checked').value,
                LINE: document.querySelector('input[name="empLine"]:checked').value,
                PROCESS: "Common",
                START: document.getElementById('dateStart').value,
                END: document.getElementById('dateEnd').value,
                REASON: document.getElementById('leaveReason').value || '-',
            };

            if(!data.NAME || !data.ID) return alert('กรุณากรอกชื่อและรหัสพนักงาน');
            btn.disabled = true; btn.innerText = "Transmitting...";

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => { alert('ส่งคำขอลาสำเร็จ'); location.reload(); })
            .catch(() => { alert('Sync Failed'); btn.disabled = false; });
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL);
                dataStore = await res.json();
                renderUI();
            } catch (err) { console.error("API Error"); }
        }

        function renderUI() {
            const histArea = document.getElementById('historyList');
            const managerArea = document.getElementById('managerList');
            const sortedRows = dataStore.slice().reverse();

            // Render Sidebar History
            histArea.innerHTML = sortedRows.map(r => `
                <div class="card-luxe">
                    <div>
                        <div class="text-xl font-extrabold text-slate-800 tracking-tight">${r[0]}</div>
                        <div class="text-[11px] font-black text-indigo-500 uppercase mt-1 tracking-widest">${r[3]} • ${r[9]}</div>
                    </div>
                    <div class="px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest ${r[7]==='Approved'?'bg-emerald-500 text-white shadow-xl shadow-emerald-100':'bg-amber-100 text-amber-700 shadow-inner'}">
                        ${r[7]}
                    </div>
                </div>`).join('');

            // Render Manager Control Feed
            const pending = sortedRows.filter(r => r[7] === 'Pending');
            managerArea.innerHTML = pending.map(r => `
                <div class="bg-white p-14 rounded-[5rem] shadow-2xl relative group border border-slate-50 transition-all hover:scale-[1.02]">
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            <span class="text-[11px] font-black text-indigo-600 uppercase tracking-widest">${r[3]} Request</span>
                            <h4 class="text-4xl font-black text-slate-900 mt-4">${r[0]}</h4>
                            <p class="text-xs font-bold text-slate-400 mt-2 uppercase tracking-tighter">Line: ${r[9]} • ID: ${r[1]}</p>
                        </div>
                        <div class="w-16 h-16 bg-slate-50 rounded-3xl flex items-center justify-center text-slate-300"><i class="fa-solid fa-quote-right text-2xl"></i></div>
                    </div>
                    <div class="mb-10 p-10 bg-slate-50 rounded-[3.5rem] text-slate-600 italic font-medium leading-relaxed border border-slate-100">"${r[6]}"</div>
                    <div class="flex gap-4">
                        <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-2 bg-slate-900 text-white py-6 rounded-full font-black text-[11px] uppercase tracking-widest shadow-2xl hover:bg-emerald-600 transition-all flex-grow">Approve</button>
                        <button onclick="updateStatus(${r[16]}, 'Rejected')" class="flex-1 bg-white text-slate-400 py-6 rounded-full font-black text-[11px] uppercase tracking-widest hover:bg-rose-50 hover:text-rose-600 border border-slate-100 transition-all">Decline</button>
                    </div>
                </div>`).join('');
            
            if(pending.length === 0) managerArea.innerHTML = "<div class='col-span-full py-40 text-center opacity-30'><i class='fa-solid fa-mug-hot text-8xl mb-8'></i><p class='font-black uppercase tracking-[0.6em]'>Feed Clear</p></div>";
        }

        async function updateStatus(rowIdx, newStatus) {
            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) 
            }).then(() => fetchData());
        }
    </script>
</body>
</html>
