<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลางานออนไลน์ v6 (เชื่อมต่อ Google Sheets)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .page-section { display: none; }
        .page-active { display: block !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold cursor-pointer" onclick="location.reload()">ระบบลางาน</h1>
        <button id="backBtn" onclick="changePage('portal')" class="hidden bg-white/20 px-4 py-1 rounded text-sm border">กลับหน้าหลัก</button>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl">
        <div id="page-portal" class="page-section page-active mt-12 text-center">
            <h2 class="text-3xl font-bold mb-10">เลือกโหมดการใช้งาน</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-3xl mx-auto">
                <div onclick="changePage('employee')" class="bg-white p-10 rounded-2xl shadow-md border-2 hover:border-blue-500 cursor-pointer">
                    <i class="fa-solid fa-user-edit text-5xl text-blue-600 mb-4"></i>
                    <h3 class="text-xl font-bold">สำหรับพนักงาน</h3>
                </div>
                <div onclick="changePage('login')" class="bg-white p-10 rounded-2xl shadow-md border-2 hover:border-gray-800 cursor-pointer">
                    <i class="fa-solid fa-user-shield text-5xl text-gray-700 mb-4"></i>
                    <h3 class="text-xl font-bold">สำหรับผู้อนุมัติ</h3>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section mt-12 max-w-md mx-auto">
            <div class="bg-white p-8 rounded-xl shadow-lg border">
                <h2 class="text-2xl font-bold text-center mb-6">Login ผู้อนุมัติ</h2>
                <input type="password" id="adminPass" placeholder="รหัสผ่าน" class="w-full border p-3 rounded-lg mb-4">
                <button onclick="handleLogin()" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold">เข้าสู่ระบบ</button>
            </div>
        </div>

        <div id="page-employee" class="page-section mt-4">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-md border lg:col-span-1">
                    <h3 class="font-bold text-lg mb-4 border-b pb-2">แจ้งรายละเอียดการลา</h3>
                    <div class="space-y-3">
                        <input type="text" id="empName" placeholder="ชื่อ-นามสกุล *" class="w-full border p-2 rounded">
                        <input type="text" id="empId" placeholder="รหัสพนักงาน *" class="w-full border p-2 rounded">
                        <select id="empStatus" class="w-full border p-2 rounded">
                            <option value="พนักงานประจำ">พนักงานประจำ</option>
                            <option value="พนักงานชั่วคราว">พนักงานชั่วคราว</option>
                        </select>
                        <select id="leaveType" class="w-full border p-2 rounded">
                            <option value="ลาป่วย">ลาป่วย</option>
                            <option value="ลากิจ">ลากิจ</option>
                            <option value="ลาพักร้อน">ลาพักร้อน</option>
                        </select>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="dateStart" class="w-full border p-2 rounded text-sm">
                            <input type="date" id="dateEnd" class="w-full border p-2 rounded text-sm">
                        </div>
                        <textarea id="leaveReason" placeholder="เหตุผลการลา" class="w-full border p-2 rounded"></textarea>
                        <button onclick="saveLeave()" id="submitBtn" class="w-full bg-blue-800 text-white py-3 rounded-lg font-bold">
                            ส่งคำร้องขอลา
                        </button>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border">
                    <h3 class="font-bold text-lg mb-4 border-b pb-2">ประวัติล่าสุด</h3>
                    <div id="empStatusList" class="space-y-2 text-center text-gray-400 py-10">กำลังโหลดข้อมูลจาก Google Sheets...</div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="page-section mt-4">
            <h2 class="text-2xl font-bold mb-6">รายการรอนุมัติ (Google Sheets)</h2>
            <div id="approverList" class="space-y-4">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script>
        /**************************************************************
         * >>> สำคัญ: วาง URL ของ Google Apps Script ที่นี่ <<<
         **************************************************************/
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx8vASllC5jEkkFdASWsGI_c46QgbZ2qpsOU2GE1MqUCcjkTEIeylBy9qFj9QfN2VvA/exec';

        function changePage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('page-active'));
            document.getElementById('page-' + pageId).classList.add('page-active');
            document.getElementById('backBtn').style.display = (pageId === 'portal') ? 'none' : 'block';
            if(pageId === 'employee' || pageId === 'approver') loadData();
        }

        function handleLogin() {
            if(document.getElementById('adminPass').value === '1234') changePage('approver');
            else alert('รหัสผ่านไม่ถูกต้อง');
        }

        // ฟังก์ชันส่งข้อมูลไป Google Sheets
        async function saveLeave() {
            const btn = document.getElementById('submitBtn');
            const data = {
                name: document.getElementById('empName').value,
                empId: document.getElementById('empId').value,
                empStatus: document.getElementById('empStatus').value,
                leaveType: document.getElementById('leaveType').value,
                start: document.getElementById('dateStart').value,
                end: document.getElementById('dateEnd').value,
                reason: document.getElementById('leaveReason').value || '-'
            };

            if(!data.name || !data.empId || !data.start) return alert('กรุณากรอกข้อมูลให้ครบ');

            btn.disabled = true;
            btn.innerText = 'กำลังส่งข้อมูล...';

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                alert('ส่งข้อมูลเข้า Google Sheets สำเร็จ!');
                location.reload();
            } catch (e) {
                alert('เกิดข้อผิดพลาด: ' + e.message);
                btn.disabled = false;
                btn.innerText = 'ส่งคำร้องขอลา';
            }
        }

        // ฟังก์ชันดึงข้อมูลจาก Google Sheets มาแสดง
        async function loadData() {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                renderTables(data);
            } catch (e) {
                console.log('ยังไม่พบข้อมูลในระบบออนไลน์');
            }
        }

        function renderTables(data) {
            const empList = document.getElementById('empStatusList');
    const appList = document.getElementById('approverList');

    if (!data || data.length === 0) {
        empList.innerHTML = "ไม่พบประวัติการลา";
        appList.innerHTML = "ไม่มีรายการรอนุมัติ";
        return;
    }

    // --- ส่วนแสดงผลของพนักงาน ---
    empList.innerHTML = `
        <table class="w-full text-sm text-left">
            <thead class="bg-gray-50">
                <tr>
                    <th class="p-2 border-b">ชื่อ/ประเภท</th>
                    <th class="p-2 border-b">วันที่ลา</th>
                    <th class="p-2 border-b text-center">สถานะ</th>
                </tr>
            </thead>
            <tbody class="divide-y">
                ${data.slice().reverse().map(row => `
                    <tr>
                        <td class="p-2 font-bold">${row[0]}<br><span class="text-[10px] text-gray-400 font-normal">${row[3]}</span></td>
                        <td class="p-2 text-xs text-gray-500">${row[4]} ถึง ${row[5]}</td>
                        <td class="p-2 text-center">
                            <span class="${row[7] === 'Approved' ? 'bg-green-500' : (row[7] === 'Rejected' ? 'bg-red-500' : 'bg-amber-500')} text-white px-2 py-0.5 rounded-full text-[10px]">
                                ${row[7]}
                            </span>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;

    // --- ส่วนแสดงผลของผู้อนุมัติ ---
    appList.innerHTML = data.slice().reverse().map((row) => {
        const isPending = row[7] === 'Pending';
        return `
            <div class="bg-white p-4 rounded-xl border-2 ${row[7] === 'Approved' ? 'border-green-500' : (row[7] === 'Rejected' ? 'border-red-500' : 'border-gray-200')} shadow-sm relative mb-4">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="font-bold text-lg">${row[0]} (${row[1]})</p>
                        <p class="text-xs text-blue-600 font-bold">${row[2]} | ${row[3]}</p>
                        <p class="text-sm text-gray-600 mt-1">วันที่: ${row[4]} ถึง ${row[5]}</p>
                        <p class="text-xs italic text-gray-500 mt-2">เหตุผล: ${row[6]}</p>
                    </div>
                    <div class="text-right">
                        ${isPending ? <span class="text-amber-500 font-bold text-sm">รออนุมัติ</span> : 
                        `<span class="${row[7] === 'Approved' ? 'text-green-600' : 'text-red-600'} font-bold uppercase text-sm">${row[7]}</span>`}
                    </div>
                </div>
            </div>
        `;
    }).join('');
        }
    </script>
</body>
</html>
