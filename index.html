<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Memo for Defective Part</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .bg-factory-green {
            background-color: #0b663b !important;
        }
        .text-factory-green {
            color: #0b663b;
        }
        .form-label-required::after {
            content: " *";
            color: red;
        }
        .hint-text {
            color: red;
            font-size: 0.85rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-factory-green px-3 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Document Flow System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Task Waiting</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active fw-bold" href="#" id="defectiveDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Defective
                        </a>
                        <ul class="dropdown-menu shadow" aria-labelledby="defectiveDropdown">
                            <li><a class="dropdown-item bg-light text-dark fw-bold" href="#">Add Defective</a></li>
                            <li><a class="dropdown-item" href="#">Search Defective</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span class="me-3">Miss WILASINEE</span>
                    <button class="btn btn-outline-light btn-sm">LogOut</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h4 class="mb-4 pb-2 border-bottom fw-bold text-secondary">Inspection Memo for Defective Part</h4>
                
                <form action="/submit-defective" method="POST" enctype="multipart/form-data">
                    
                    <div class="row g-4">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold form-label-required">MMA No</label>
                            <input type="text" class="form-control" name="mma_no" placeholder="เช่น 543629" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold form-label-required">Product</label>
                            <select class="form-select" name="product" required>
                                <option value="" selected disabled>เลือก Product</option>
                                <option value="RF">RF</option>
                                <option value="W/M">W/M</option>
                                <option value="REF">REF</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold form-label-required">DEF. DATE</label>
                            <input type="date" class="form-control" name="def_date" required>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold form-label-required">Vendor</label>
                            <select class="form-select" name="vendor" required>
                                <option value="" selected disabled>-- กดคลิกเลือก VENDOR --</option>
                                <option value="(CQ6) CHUNG CHENG PLASTIC (THAILAND) CO.,">(CQ6) CHUNG CHENG PLASTIC (THAILAND) CO.,</option>
                                <option value="(A01) SAMPLE VENDOR CO., LTD.">(A01) SAMPLE VENDOR CO., LTD.</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold form-label-required">Part Code</label>
                            <div class="input-group">
                                <input type="text" class="form-control" name="part_code" placeholder="เช่น UPOK-A248CBFA" required>
                                <button class="btn btn-outline-secondary" type="button">search...</button>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold form-label-required">Part Name</label>
                            <input type="text" class="form-control" name="part_name" placeholder="เช่น BOTTLE POCKET" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold form-label-required">For Model</label>
                            <input type="text" class="form-control" name="for_model" placeholder="เช่น 22,25" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold form-label-required">Def. Qty</label>
                            <input type="number" class="form-control" name="def_qty" min="1" placeholder="1" required>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold form-label-required">Defective Phenomenon</label>
                            <textarea class="form-control" name="phenomenon" rows="4" placeholder="Scratch" required></textarea>
                            <div class="hint-text mt-1">** Use English is better</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Attach PDF</label>
                            <input class="form-control" type="file" name="attach_pdf" accept=".pdf">
                            <div class="text-danger mt-1" style="font-size: 0.85rem;">Limit 5 MB</div>
                        </div>
                    </div>

                    <div class="mt-5 pt-3 border-top text-center">
                        <button type="button" class="btn btn-outline-secondary px-4 me-2">Save As Draft</button>
                        <button type="submit" class="btn btn-success px-5 fw-bold bg-factory-green">Submit</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
