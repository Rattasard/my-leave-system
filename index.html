<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Leave Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Sarabun:wght@300;400;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .page-section { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .page-active { display: block !important; opacity: 1; transform: translateY(0); }
        .gradient-btn { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .input-focus:focus { border-color: #6366f1; ring: 2px; ring-color: #6366f1; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="glass sticky top-0 z-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <i class="fa-solid fa-calendar-check text-xl"></i>
            </div>
            <span class="font-bold text-xl tracking-tight text-slate-800">LeaveHub</span>
        </div>
        <button id="backBtn" onclick="changePage('portal')" class="hidden text-sm font-semibold text-slate-500 hover:text-indigo-600 transition-all flex items-center gap-1">
            <i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก
        </button>
    </nav>

    <div class="container mx-auto p-6 max-w-6xl">
        
        <div id="page-portal" class="page-section page-active mt-16 text-center">
            <h2 class="text-4xl font-extrabold text-slate-900 mb-4">ยินดีต้อนรับสู่ระบบจัดการการลา</h2>
            <p class="text-slate-500 mb-12">เลือกโหมดการใช้งานเพื่อเริ่มต้น</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-3xl mx-auto">
                <div onclick="changePage('employee')" class="group bg-white p-10 rounded-3xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-indigo-500 transition-all cursor-pointer">
                    <div class="bg-indigo-50 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-user-plus text-3xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">พนักงาน</h3>
                    <p class="text-slate-400 text-sm">ส่งคำขอลา และติดตามสถานะ</p>
                </div>
                <div onclick="changePage('login')" class="group bg-white p-10 rounded-3xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-slate-800 transition-all cursor-pointer">
                    <div class="bg-slate-50 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-slate-800 group-hover:text-white transition-all">
                        <i class="fa-solid fa-shield-halved text-3xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">ผู้อนุมัติ</h3>
                    <p class="text-slate-400 text-sm">จัดการคำขออนุมัติทั้งหมด</p>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section mt-20 max-w-md mx-auto">
            <div class="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100 text-center">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-lock text-2xl text-slate-600"></i>
                </div>
                <h3 class="text-2xl font-bold mb-2">เข้าสู่ระบบจัดการ</h3>
                <p class="text-slate-400 text-sm mb-8">ระบุรหัสผ่านเพื่อดำเนินการต่อ</p>
                <input type="password" id="adminPass" placeholder="••••••••" class="w-full border border-slate-200 p-4 rounded-2xl mb-6 text-center text-xl tracking-widest outline-none focus:border-indigo-500 transition-all">
                <button onclick="handleLogin()" class="w-full gradient-btn text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-200 hover:scale-[1.02] active:scale-95 transition-all">เข้าสู่ระบบ</button>
            </div>
        </div>

        <div id="page-employee" class="page-section">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-4 bg-white p-8 rounded-3xl shadow-sm border border-slate-200 h-fit">
                    <h3 class="text-xl font-bold mb-8 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-indigo-600"></i> สร้างคำขอใหม่
                    </h3>
                    <div class="space-y-5">
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-400 ml-1">ชื่อ-นามสกุล</label>
                            <input type="text" id="empName" class="w-full border border-slate-200 p-3 rounded-xl text-sm outline-none focus:border-indigo-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-400 ml-1">รหัสพนักงาน</label>
                            <input type="text" id="empId" class="w-full border border-slate-200 p-3 rounded-xl text-sm outline-none focus:border-indigo-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-400 ml-1">ประเภทพนักงาน</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="setStatus('พนักงานประจำ')" id="btn-perm" class="status-btn border border-slate-200 py-2 rounded-xl text-xs font-bold transition-all bg-white">พนักงานประจำ</button>
                                <button onclick="setStatus('พนักงานชั่วคราว')" id="btn-temp" class="status-btn border border-slate-200 py-2 rounded-xl text-xs font-bold transition-all bg-white">พนักงานชั่วคราว</button>
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-400 ml-1">ประเภทการลา</label>
                            <select id="leaveType" class="w-full border border-slate-200 p-3 rounded-xl text-sm bg-slate-50 outline-none">
                                <option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-slate-400">เริ่มวันที่</label>
                                <input type="date" id="dateStart" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-slate-400">สิ้นสุดวันที่</label>
                                <input type="date" id="dateEnd" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-400 ml-1">เหตุผลเพิ่มเติม</label>
                            <textarea id="leaveReason" class="w-full border border-slate-200 p-3 rounded-xl text-sm h-24 outline-none focus:border-indigo-500"></textarea>
                        </div>
                        <button onclick="saveLeave()" id="submitBtn" class="w-full gradient-btn text-white py-4 rounded-2xl font-bold shadow-md hover:scale-[1.01] active:scale-95 transition-all">ส่งคำร้องขออนุมัติ</button>
                    </div>
                </div>
                <div class="lg:col-span-8 bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-xl font-bold">ประวัติการลาพนักงาน</h3>
                        <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-indigo-600"></div>
                    </div>
                    <div id="empStatusList" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="page-section">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                <div>
                    <h2 class="text-3xl font-bold text-slate-900">แผงควบคุมการอนุมัติ</h2>
                    <p class="text-slate-400 text-sm">พิจารณาคำขอรอนุมัติจากพนักงานในทีม</p>
                </div>
                <button onclick="loadData()" class="bg-white border border-slate-200 px-6 py-2.5 rounded-2xl text-sm font-bold shadow-sm hover:bg-slate-50 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> รีเฟรชข้อมูล
                </button>
            </div>
            <div id="approverList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycby3vheY-8EO5fs51R2GRrF9kf1V_e3hK68H7ostLOFCENLEkW1C-fF0g9E1VPucvL8z/exec';
        let selectedStatus = 'พนักงานประจำ';

        function changePage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('page-active'));
            setTimeout(() => {
                document.getElementById('page-' + pageId).classList.add('page-active');
            }, 50);
            document.getElementById('backBtn').classList.toggle('hidden', pageId === 'portal');
            if(pageId === 'employee' || pageId === 'approver') loadData();
            if(pageId === 'employee') setStatus('พนักงานประจำ');
        }

        function setStatus(status) {
            selectedStatus = status;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.replace('bg-indigo-600', 'bg-white'));
            document.querySelectorAll('.status-btn').forEach(b => b.classList.replace('text-white', 'text-slate-600'));
            const activeBtn = status === 'พนักงานประจำ' ? 'btn-perm' : 'btn-temp';
            document.getElementById(activeBtn).classList.replace('bg-white', 'bg-indigo-600');
            document.getElementById(activeBtn).classList.replace('text-slate-600', 'text-white');
        }

        function handleLogin() {
            if(document.getElementById('adminPass').value === '1234') changePage('approver');
            else alert('รหัสผ่านไม่ถูกต้อง');
        }

        async function saveLeave() {
            const btn = document.getElementById('submitBtn');
            const data = { 
                action: 'addLeave', 
                name: document.getElementById('empName').value, 
                empId: document.getElementById('empId').value, 
                empStatus: selectedStatus,
                leaveType: document.getElementById('leaveType').value, 
                start: document.getElementById('dateStart').value, 
                end: document.getElementById('dateEnd').value, 
                reason: document.getElementById('leaveReason').value || '-' 
            };
            if(!data.name || !data.empId || !data.start) return alert('กรุณากรอกข้อมูลให้ครบ');
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> กำลังส่ง...';
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            alert('ส่งคำร้องสำเร็จ');
            window.location.reload();
        }

        async function loadData() {
            document.getElementById('loader')?.classList.remove('hidden');
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                renderTables(data);
            } catch (e) { console.error(e); }
            document.getElementById('loader')?.classList.add('hidden');
        }

        function renderTables(data) {
            const empArea = document.getElementById('empStatusList');
            const appArea = document.getElementById('approverList');
            const rows = data.slice().reverse();

            empArea.innerHTML = rows.map(r => `
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center font-bold text-indigo-600 shadow-sm">${r[0].charAt(0)}</div>
                        <div>
                            <div class="font-bold text-sm">${r[0]} <span class="text-[10px] text-slate-400 ml-2">ID: ${r[1]}</span></div>
                            <div class="text-[11px] text-slate-500">${r[3]} • ${r[4]} ถึง ${r[5]}</div>
                        </div>
                    </div>
                    <div class="px-4 py-1.5 rounded-full text-[10px] font-bold text-white shadow-sm ${r[7]==='Approved'?'bg-emerald-500':(r[7]==='Rejected'?'bg-rose-500':'bg-amber-400')}">${r[7]}</div>
                </div>
            `).join('');

            appArea.innerHTML = rows.map((r, i) => `
                <div id="card-${i}" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 transition-all hover:shadow-md">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xl">${r[0].charAt(0)}</div>
                            <div>
                                <h4 class="font-bold text-slate-800">${r[0]}</h4>
                                <span class="text-xs font-bold text-indigo-500">${r[2]} (ID: ${r[1]})</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-400 block uppercase font-bold tracking-wider">สถานะปัจจุบัน</span>
                            <span class="text-xs font-bold ${r[7]==='Approved'?'text-emerald-500':(r[7]==='Rejected'?'text-rose-500':'text-amber-500')}">${r[7]}</span>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl mb-6">
                        <div class="flex justify-between text-xs mb-2 text-slate-400"><span>ประเภท: <b class="text-slate-600">${r[3]}</b></span> <span>วันที่: <b class="text-slate-600">${r[4]} ถึง ${r[5]}</b></span></div>
                        <p class="text-xs text-slate-600 leading-relaxed"><b class="text-slate-400">เหตุผล:</b> ${r[6]}</p>
                    </div>
                    <div id="btn-group-${i}">
                        ${r[7] === 'Pending' ? `
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="updateStatusOnline('${r[1]}','${r[4]}','Approved', ${i})" class="bg-emerald-500 text-white py-3 rounded-xl text-xs font-bold shadow-sm shadow-emerald-100 hover:bg-emerald-600 transition-all">อนุมัติ</button>
                                <button onclick="updateStatusOnline('${r[1]}','${r[4]}','Rejected', ${i})" class="bg-white border border-rose-200 text-rose-500 py-3 rounded-xl text-xs font-bold hover:bg-rose-50 transition-all">ปฏิเสธ</button>
                            </div>
                        ` : `<div class="text-center py-2 text-xs font-black uppercase tracking-widest ${r[7]==='Approved'?'text-emerald-500':'text-rose-500'}">${r[7]} COMPLETED</div>`}
                    </div>
                </div>
            `).join('');
        }

        async function updateStatusOnline(empId, start, status, idx) {
            if(!confirm(`ยืนยันการ "${status}" ใช่หรือไม่?`)) return;
            const btnGroup = document.getElementById(`btn-group-${idx}`);
            btnGroup.innerHTML = `<div class="text-center py-2 text-indigo-600 font-bold animate-pulse text-xs italic">กำลังส่งข้อมูลไปยังระบบ...</div>`;
            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'updateStatus', empId: empId, start: start, status: status })
                });
                setTimeout(() => {
                    loadData();
                }, 1500);
            } catch (e) { alert('เกิดข้อผิดพลาด'); loadData(); }
        }
    </script>
</body>
</html>
