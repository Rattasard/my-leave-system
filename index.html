<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM SKY - LEAVE APPROVE SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; color: #1e293b; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 2rem; border: 1px solid #ffffff; }
        .page-section { display: none; }
        .active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Radio Style */
        .choice-input:checked + .choice-label {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .choice-label { transition: all 0.2s; border: 2px solid #e2e8f0; background: white; cursor: pointer; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="pb-10">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md shadow-sm p-4 flex justify-between items-center px-6 md:px-12 border-b">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="bg-blue-600 text-white p-2 rounded-xl shadow-lg"><i class="fa-solid fa-paper-plane"></i></div>
            <span class="text-xl font-black tracking-tight">HRM <span class="text-blue-600">SKY</span></span>
        </div>
        <button id="backBtn" onclick="showPage('portal')" class="hidden bg-slate-100 px-4 py-2 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-200">
            <i class="fa-solid fa-house mr-1"></i> กลับหน้าหลัก
        </button>
    </nav>

    <div class="container mx-auto p-4 max-w-6xl mt-6">
        
        <div id="page-portal" class="page-section active text-center py-10">
            <h1 class="text-4xl font-black mb-10 text-slate-800 italic uppercase">ระบบจัดการการลาพนักงาน (Full Option)</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-2xl mx-auto">
                <div onclick="showPage('employee')" class="bg-white p-12 rounded-[3rem] shadow-xl cursor-pointer border-b-[10px] border-blue-500 hover:-translate-y-2 transition-all">
                    <i class="fa-solid fa-user-pen text-5xl text-blue-500 mb-5"></i>
                    <h3 class="text-2xl font-black">สำหรับพนักงาน</h3>
                    <p class="text-slate-400 text-sm mt-2 font-medium italic italic">เขียนใบลา / ตรวจเช็คสถานะ</p>
                </div>
                <div onclick="showPage('login')" class="bg-slate-900 p-12 rounded-[3rem] shadow-xl cursor-pointer border-b-[10px] border-indigo-600 hover:-translate-y-2 transition-all text-white">
                    <i class="fa-solid fa-user-shield text-5xl mb-5"></i>
                    <h3 class="text-2xl font-black text-white">สำหรับผู้อนุมัติ</h3>
                    <p class="text-slate-500 text-sm mt-2 font-medium italic italic">พิจารณาอนุมัติใบลา</p>
                </div>
            </div>
        </div>

        <div id="page-employee" class="page-section">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 glass-card p-8 shadow-2xl border-t-8 border-blue-600">
                    <h3 class="text-2xl font-black mb-6 italic text-blue-700 underline">กรอกใบลาออนไลน์</h3>
                    <div class="space-y-5">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="w-full p-4 rounded-2xl border bg-white outline-none focus:border-blue-500 shadow-sm">
                            <input type="text" id="empId" placeholder="รหัสพนักงาน" class="w-full p-4 rounded-2xl border bg-white outline-none focus:border-blue-500 shadow-sm">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <p class="text-[11px] font-bold text-slate-400 ml-1">ประเภทพนักงาน</p>
                                <div class="flex gap-2">
                                    <label class="flex-1"><input type="radio" name="empStatus" value="ประจำ" class="hidden choice-input" checked><div class="choice-label p-2 rounded-xl text-center text-[10px] font-bold">ประจำ</div></label>
                                    <label class="flex-1"><input type="radio" name="empStatus" value="ชั่วคราว" class="hidden choice-input"><div class="choice-label p-2 rounded-xl text-center text-[10px] font-bold">ชั่วคราว</div></label>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <p class="text-[11px] font-bold text-slate-400 ml-1">ประเภทการลา</p>
                                <div class="flex gap-1">
                                    <label class="flex-1"><input type="radio" name="leaveType" value="ลาป่วย" class="hidden choice-input" checked><div class="choice-label p-2 rounded-xl text-center text-[9px] font-bold">ป่วย</div></label>
                                    <label class="flex-1"><input type="radio" name="leaveType" value="ลากิจ" class="hidden choice-input"><div class="choice-label p-2 rounded-xl text-center text-[9px] font-bold">กิจ</div></label>
                                    <label class="flex-1"><input type="radio" name="leaveType" value="พักร้อน" class="hidden choice-input"><div class="choice-label p-2 rounded-xl text-center text-[9px] font-bold">พักร้อน</div></label>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <p class="text-[11px] font-bold text-slate-400 ml-1">LINE การผลิต</p>
                            <div class="grid grid-cols-6 gap-1">
                                <label><input type="radio" name="empLine" value="C" class="hidden choice-input" checked><div class="choice-label p-2 rounded-lg text-center text-[10px] font-bold">C</div></label>
                                <label><input type="radio" name="empLine" value="E" class="hidden choice-input"><div class="choice-label p-2 rounded-lg text-center text-[10px] font-bold">E</div></label>
                                <label><input type="radio" name="empLine" value="F" class="hidden choice-input"><div class="choice-label p-2 rounded-lg text-center text-[10px] font-bold">F</div></label>
                                <label><input type="radio" name="empLine" value="Office" class="hidden choice-input"><div class="choice-label p-2 rounded-lg text-center text-[10px] font-bold">OFC</div></label>
                                <label><input type="radio" name="empLine" value="TC" class="hidden choice-input"><div class="choice-label p-2 rounded-lg text-center text-[10px] font-bold">TC</div></label>
                                <label><input type="radio" name="empLine" value="Common" class="hidden choice-input"><div class="choice-label p-2 rounded-lg text-center text-[10px] font-bold">CM</div></label>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <p class="text-[11px] font-bold text-slate-400 ml-1">แผนก (Process)</p>
                            <div class="grid grid-cols-3 gap-2">
                                <label><input type="radio" name="empProcess" value="Assy" class="hidden choice-input" checked><div class="choice-label p-3 rounded-xl text-center text-xs font-black italic uppercase">Assy</div></label>
                                <label><input type="radio" name="empProcess" value="Elec" class="hidden choice-input"><div class="choice-label p-3 rounded-xl text-center text-xs font-black italic uppercase">Elec</div></label>
                                <label><input type="radio" name="empProcess" value="Pack" class="hidden choice-input"><div class="choice-label p-3 rounded-xl text-center text-xs font-black italic uppercase">Pack</div></label>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white p-3 rounded-2xl border"><label class="text-[10px] font-bold text-blue-600 block mb-1 uppercase">เริ่ม</label><input type="date" id="dateStart" class="w-full text-xs outline-none font-bold"></div>
                            <div class="bg-white p-3 rounded-2xl border"><label class="text-[10px] font-bold text-blue-600 block mb-1 uppercase">ถึง</label><input type="date" id="dateEnd" class="w-full text-xs outline-none font-bold"></div>
                        </div>

                        <textarea id="leaveReason" placeholder="ระบุเหตุผลการลา..." class="w-full p-4 rounded-2xl border bg-white h-24 outline-none focus:border-blue-500 shadow-inner"></textarea>
                        
                        <div class="bg-blue-50 p-4 rounded-2xl border-2 border-dashed border-blue-200">
                            <p class="text-[10px] font-bold text-blue-600 mb-2 uppercase italic"><i class="fa-solid fa-camera mr-1"></i> แนบรูปหลักฐาน</p>
                            <input type="file" id="fileInput" accept="image/*" class="text-[10px] w-full file:bg-blue-600 file:text-white file:border-0 file:rounded-md file:px-3 file:py-1 cursor-pointer">
                        </div>

                        <button onclick="submitLeave()" id="submitBtn" class="w-full bg-blue-600 text-white py-5 rounded-[2rem] font-black text-xl shadow-xl hover:bg-blue-700 active:scale-95 transition-all uppercase tracking-widest italic">ส่งข้อมูลลงชีท</button>
                    </div>
                </div>

                <div class="lg:col-span-7 glass-card p-8 shadow-xl">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-black italic text-slate-700 underline decoration-blue-500">สถานะการลาล่าสุด</h3>
                        <button onclick="fetchData()" class="text-[10px] font-bold bg-white border px-4 py-2 rounded-full hover:bg-slate-50"><i class="fa-solid fa-sync mr-1"></i> อัปเดต</button>
                    </div>
                    <div id="empList" class="space-y-3 h-[750px] overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section">
            <div class="glass-card p-12 max-w-md mx-auto text-center mt-12 border-t-8 border-indigo-600 shadow-2xl">
                <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-inner"><i class="fa-solid fa-lock text-3xl"></i></div>
                <h3 class="text-xl font-black mb-6 uppercase">ยืนยันรหัสผู้อนุมัติ</h3>
                <input type="password" id="adminPass" class="w-full p-5 rounded-2xl border bg-slate-50 text-center text-4xl tracking-[0.3em] outline-none mb-8 focus:border-indigo-600 shadow-inner">
                <button onclick="checkLogin()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl hover:bg-indigo-700 transition-all uppercase tracking-widest shadow-lg">เข้าสู่ระบบ</button>
            </div>
        </div>

        <div id="page-approver" class="page-section">
            <div class="glass-card p-8 mb-8 flex justify-between items-center border-l-[15px] border-indigo-600 shadow-xl">
                <div>
                    <h2 class="text-3xl font-black italic text-slate-800">รายการรออนุมัติ</h2>
                    <p id="roleBadge" class="text-indigo-600 font-bold text-[10px] bg-indigo-50 px-4 py-1.5 rounded-full mt-2 inline-block uppercase border border-indigo-100"></p>
                </div>
                <button onclick="fetchData()" class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-md hover:bg-indigo-700"><i class="fa-solid fa-sync mr-2"></i> รีเฟรชข้อมูล</button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <script>
        // --- ⚠️ สำคัญมาก: เปลี่ยนเป็น URL ของคุณ ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxLZPmElY4__2sFMpRH4JLvt6twSAXhaOK-B4ZONxSeujEtSn1kpFqd0NlLxl6d6b-Y/exec'; 

        let currentRole = "";
        let rawData = [];

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('backBtn').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'approver') fetchData();
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            // รหัสผ่าน: Assy(7843), Elec(1332), Pack(80006), Sup(7605), Manager(9764)
            const roles = {'7843':'Assy','1332':'Elec','80006':'Pack','7605':'Sup','9764':'Manager'};
            if(roles[pass]) { currentRole = roles[pass]; document.getElementById('roleBadge').innerText = "ระดับสิทธิ์: " + currentRole; showPage('approver'); }
            else alert('❌ รหัสผ่านไม่ถูกต้อง');
        }

        async function getFileData() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return null;
            const file = fileInput.files[0];
            const reader = new FileReader();
            return new Promise(resolve => {
                reader.onload = e => resolve({ base64: e.target.result.split(',')[1], type: file.type, name: file.name });
                reader.readAsDataURL(file);
            });
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const fileData = await getFileData();
            const data = {
                action: 'addLeave',
                NAME: document.getElementById('empName').value,
                ID: document.getElementById('empId').value,
                EMP_STATUS: document.querySelector('input[name="empStatus"]:checked').value,
                LEAVE_TYPE: document.querySelector('input[name="leaveType"]:checked').value,
                LINE: document.querySelector('input[name="empLine"]:checked').value,
                PROCESS: document.querySelector('input[name="empProcess"]:checked').value,
                START: document.getElementById('dateStart').value,
                END: document.getElementById('dateEnd').value,
                REASON: document.getElementById('leaveReason').value || '-',
                FILE: fileData
            };

            if(!data.NAME || !data.ID || !data.START) return alert('⚠️ กรุณากรอกข้อมูลสำคัญให้ครบ!');
            
            btn.disabled = true; btn.innerText = "กำลังเชื่อมต่อระบบ...";

            // ใช้ Fetch แบบ POST พร้อมส่งข้อมูลเป็น String
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // สำคัญ: เพื่อไม่ให้ติด CORS
                cache: 'no-cache',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/json' }
            }).then(() => {
                alert('✅ ส่งข้อมูลเรียบร้อย! โปรดรอตรวจสอบในชีท');
                location.reload();
            }).catch(e => {
                console.error(e);
                alert('ส่งข้อมูลสำเร็จ');
                location.reload();
            });
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL);
                rawData = await res.json();
                renderUI();
            } catch(e) { console.log("Fetch error: ", e); }
        }

        function renderUI() {
            const empArea = document.getElementById('empList');
            const managerArea = document.getElementById('managerList');
            const rows = rawData.slice().reverse();

            empArea.innerHTML = rows.map(r => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center transition-all hover:bg-white hover:shadow-md">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-black uppercase italic">${r[0].charAt(0)}</div>
                        <div>
                            <div class="font-black text-slate-800">${r[0]} <span class="text-[10px] text-slate-400 font-normal">#${r[1]}</span></div>
                            <div class="text-[9px] font-bold text-blue-500 mt-1 uppercase italic leading-none">${r[3]} | ${r[10]} | Line ${r[9]}</div>
                            <div class="text-[9px] text-slate-400 mt-1 font-bold">${r[4]} ถึง ${r[5]}</div>
                        </div>
                    </div>
                    <div class="px-4 py-2 rounded-full text-[10px] font-black uppercase text-white shadow-lg ${r[7]==='Approved'?'bg-emerald-500':(r[7]==='Rejected'?'bg-rose-500':'bg-amber-400')}">
                        ${r[7]}
                    </div>
                </div>`).join('');

            const filtered = rows.filter(r => r[7] === 'Pending');
            managerArea.innerHTML = filtered.map(r => `
                <div class="bg-white p-7 rounded-[2.5rem] shadow-xl border-l-[12px] border-indigo-600 transition-all hover:scale-[1.02]">
                    <div class="flex justify-between items-start mb-4">
                        <div><h4 class="text-xl font-black text-slate-900 leading-tight">${r[0]}</h4><p class="text-[10px] font-bold text-indigo-500 italic uppercase mt-1">${r[10]} / Line ${r[9]}</p></div>
                        <span class="bg-slate-50 px-3 py-1 rounded-lg text-[9px] font-black text-slate-400 italic">${r[2]}</span>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl mb-4 text-xs italic text-slate-600 border border-slate-100 shadow-inner">" ${r[6]} "</div>
                    <div class="text-[10px] font-black text-slate-400 mb-5 uppercase italic"><i class="fa-solid fa-clock mr-1"></i> ${r[3]} (${r[4]} ถึง ${r[5]})</div>
                    ${r[17] ? `<a href="${r[17]}" target="_blank" class="block text-center text-blue-600 font-black text-[10px] bg-blue-50 py-3 rounded-xl mb-5 hover:bg-blue-600 hover:text-white transition-all"><i class="fa-solid fa-image mr-1"></i> ดูหลักฐาน</a>` : ''}
                    <div class="flex gap-3">
                        <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-emerald-600 transition-all text-xs uppercase italic tracking-widest">อนุมัติ</button>
                        <button onclick="updateStatus(${r[16]}, 'Rejected')" class="flex-1 bg-white border-2 border-rose-100 text-rose-500 py-4 rounded-2xl font-black hover:bg-rose-50 transition-all text-xs uppercase italic">ปฏิเสธ</button>
                    </div>
                </div>`).join('');
            if(filtered.length === 0) managerArea.innerHTML = "<div class='col-span-full text-center py-20 text-slate-300 font-black italic uppercase text-2xl tracking-tighter opacity-50'>--- ไม่มีรายการรออนุมัติ ---</div>";
        }

        async function updateStatus(rowIdx, newStatus) {
            if(!confirm('ยืนยันรายการนี้?')) return;
            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) 
            }).then(() => { alert('✅ อัปเดตข้อมูลสำเร็จ!'); fetchData(); });
        }
    </script>
</body>
</html>
