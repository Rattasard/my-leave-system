<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM PREMIUM SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background: #f8fafc; }
        .page-section { display: none; }
        .active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 2rem; border: 1px solid #fff; }
        
        /* สไตล์ปุ่มตัวเลือก (Radio Selection) */
        .select-card input:checked + .card-box {
            border-color: #4f46e5;
            background-color: #eef2ff;
            color: #4f46e5;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1);
        }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 p-4 border-b flex justify-between items-center px-8 shadow-sm">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="bg-indigo-600 text-white p-2 rounded-2xl shadow-lg shadow-indigo-200"><i class="fa-solid fa-bolt-lightning text-xl"></i></div>
            <div>
                <span class="text-xl font-black block leading-none text-slate-900">HRM PRO</span>
                <span class="text-[10px] text-indigo-500 font-bold uppercase tracking-widest text-nowrap">Premium System</span>
            </div>
        </div>
        <button id="backBtn" onclick="showPage('portal')" class="hidden bg-slate-100 text-slate-600 px-5 py-2 rounded-xl text-xs font-bold hover:bg-slate-200 transition-all flex items-center gap-2">
            <i class="fa-solid fa-house"></i> กลับหน้าหลัก
        </button>
    </nav>

    <div class="container mx-auto p-4 max-w-6xl mt-6">
        
        <div id="page-portal" class="page-section active text-center py-10">
            <h1 class="text-5xl font-black text-slate-900 mb-4 tracking-tighter">เข้าใช้งานระบบ</h1>
            <p class="text-slate-500 mb-12">กรุณาเลือกโหมดการใช้งานที่ต้องการ</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto px-4">
                <div onclick="showPage('employee')" class="group relative bg-white p-10 cursor-pointer rounded-[3rem] transition-all shadow-2xl hover:shadow-indigo-200 hover:-translate-y-2 border-b-[10px] border-indigo-600">
                    <div class="w-24 h-24 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6 transition-colors group-hover:bg-indigo-600 group-hover:text-white">
                        <i class="fa-solid fa-user-edit text-4xl"></i>
                    </div>
                    <h3 class="text-3xl font-black mb-2">หน้าพนักงาน</h3>
                    <p class="text-slate-400">สร้างใบลา และ ตรวจสอบสถานะ</p>
                </div>
                
                <div onclick="showPage('login')" class="group relative bg-slate-900 p-10 cursor-pointer rounded-[3rem] transition-all shadow-2xl hover:shadow-slate-400 hover:-translate-y-2 border-b-[10px] border-slate-700">
                    <div class="w-24 h-24 bg-slate-800 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 group-hover:bg-white group-hover:text-slate-900">
                        <i class="fa-solid fa-user-shield text-4xl"></i>
                    </div>
                    <h3 class="text-3xl font-black mb-2 text-white">หน้าผู้อนุมัติ</h3>
                    <p class="text-slate-400">พิจารณาคำขอ และ อนุมัติการลา</p>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section">
            <div class="glass p-10 max-w-md mx-auto shadow-2xl text-center mt-10 border-t-8 border-slate-900">
                <h3 class="text-2xl font-bold mb-8 italic">Approver Identity</h3>
                <input type="password" id="adminPass" placeholder="ระบุรหัสผ่านตำแหน่ง" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl mb-6 text-center text-2xl outline-none focus:border-indigo-600 transition-all tracking-widest">
                <button onclick="checkLogin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl hover:bg-black transition-all">เข้าสู่ระบบ</button>
            </div>
        </div>

        <div id="page-employee" class="page-section">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 glass p-8 shadow-xl border-t-8 border-indigo-600">
                    <h3 class="font-bold text-2xl mb-6 flex items-center gap-2 text-indigo-600">สร้างใบลาออนไลน์</h3>
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="bg-slate-50 p-4 rounded-2xl outline-none w-full border focus:border-indigo-300">
                            <input type="text" id="empId" placeholder="รหัสพนักงาน" class="bg-slate-50 p-4 rounded-2xl outline-none w-full border focus:border-indigo-300">
                        </div>

                        <div>
                            <p class="text-xs font-bold text-slate-400 ml-2 mb-2 uppercase">ประเภทพนักงาน</p>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empStatus" value="พนักงานประจำ" class="hidden" checked>
                                    <div class="card-box bg-slate-50 p-3 rounded-xl text-center font-bold border-2 border-transparent transition-all">ประจำ</div>
                                </label>
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empStatus" value="พนักงานชั่วคราว" class="hidden">
                                    <div class="card-box bg-slate-50 p-3 rounded-xl text-center font-bold border-2 border-transparent transition-all">ชั่วคราว</div>
                                </label>
                            </div>
                        </div>

                        <div>
                            <p class="text-xs font-bold text-slate-400 ml-2 mb-2 uppercase">Line การผลิต</p>
                            <div class="grid grid-cols-4 gap-2">
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empLine" value="C" class="hidden" checked>
                                    <div class="card-box bg-slate-50 p-2 rounded-xl text-center font-bold border-2 border-transparent transition-all">C</div>
                                </label>
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empLine" value="E" class="hidden">
                                    <div class="card-box bg-slate-50 p-2 rounded-xl text-center font-bold border-2 border-transparent transition-all">E</div>
                                </label>
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empLine" value="F" class="hidden">
                                    <div class="card-box bg-slate-50 p-2 rounded-xl text-center font-bold border-2 border-transparent transition-all">F</div>
                                </label>
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empLine" value="TC" class="hidden">
                                    <div class="card-box bg-slate-50 p-2 rounded-xl text-center font-bold border-2 border-transparent transition-all text-xs">TC</div>
                                </label>
                            </div>
                        </div>

                        <div>
                            <p class="text-xs font-bold text-slate-400 ml-2 mb-2 uppercase">Process</p>
                            <div class="grid grid-cols-3 gap-2">
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empProcess" value="Assy" class="hidden" checked>
                                    <div class="card-box bg-slate-50 p-3 rounded-xl text-center font-bold border-2 border-transparent transition-all">Assy</div>
                                </label>
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empProcess" value="Elec" class="hidden">
                                    <div class="card-box bg-slate-50 p-3 rounded-xl text-center font-bold border-2 border-transparent transition-all">Elec</div>
                                </label>
                                <label class="select-card cursor-pointer">
                                    <input type="radio" name="empProcess" value="Pack" class="hidden">
                                    <div class="card-box bg-slate-50 p-3 rounded-xl text-center font-bold border-2 border-transparent transition-all">Pack</div>
                                </label>
                            </div>
                        </div>

                        <select id="leaveType" class="bg-slate-50 p-4 rounded-2xl outline-none w-full font-bold border focus:border-indigo-300">
                            <option>ลาป่วย</option>
                            <option>ลากิจ</option>
                            <option>ลาพักร้อน</option>
                        </select>

                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div><label class="ml-2 font-bold text-slate-400">เริ่มวันที่</label><input type="date" id="dateStart" class="bg-slate-50 p-4 rounded-2xl w-full mt-1 border"></div>
                            <div><label class="ml-2 font-bold text-slate-400">สิ้นสุดวันที่</label><input type="date" id="dateEnd" class="bg-slate-50 p-4 rounded-2xl w-full mt-1 border"></div>
                        </div>

                        <textarea id="leaveReason" placeholder="เหตุผลการลา..." class="bg-slate-50 p-4 rounded-2xl outline-none w-full h-24 border focus:border-indigo-300"></textarea>
                        
                        <button onclick="submitLeave()" id="submitBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:scale-[0.98] transition-all">ส่งใบลา</button>
                    </div>
                </div>

                <div class="lg:col-span-7 glass p-8 shadow-xl overflow-hidden">
                    <h3 class="font-bold text-2xl mb-6">สถานะการลาล่าสุด</h3>
                    <div id="empList" class="space-y-3 h-[650px] overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="page-section">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-[2rem] shadow-sm">
                <div>
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">รายการรอพิจารณา</h2>
                    <p id="roleBadge" class="text-indigo-600 font-bold bg-indigo-50 px-3 py-1 rounded-lg mt-1 text-xs inline-block uppercase"></p>
                </div>
                <button onclick="fetchData()" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:scale-[0.98] transition-all flex items-center gap-2"><i class="fa-solid fa-rotate"></i> อัปเดตข้อมูล</button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <script>
        // *** วาง URL ของ Google Web App ที่นี่ ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycby15Oxko9rm6GaE_gmKtPQ_PBeIrQPviXiHBzBqn_hxxEgjKKGuvhTeSpTMiAh1BIIA/exec';
        
        let currentRole = "";
        let rawData = [];

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('backBtn').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'approver') fetchData();
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === '7843') currentRole = "Assy";
            else if (pass === '1332') currentRole = "Elec";
            else if (pass === '80006') currentRole = "Pack";
            else if (pass === '7605') currentRole = "Sup";
            else if (pass === '6419') currentRole = "Senior_Sup";
            else if (pass === '10106') currentRole = "Asst_Chief";
            else if (pass === '9764') currentRole = "Manager";
            else return alert('⚠️ รหัสผ่านไม่ถูกต้อง');
            
            document.getElementById('roleBadge').innerText = "ระดับ: " + currentRole;
            showPage('approver');
            document.getElementById('adminPass').value = ""; // เคลียร์รหัสหลังเข้า
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const data = {
                action: 'addLeave',
                name: document.getElementById('empName').value,
                empId: document.getElementById('empId').value,
                // ดึงค่าจากปุ่ม Radio ที่เลือก
                empStatus: document.querySelector('input[name="empStatus"]:checked').value,
                line: document.querySelector('input[name="empLine"]:checked').value,
                process: document.querySelector('input[name="empProcess"]:checked').value,
                leaveType: document.getElementById('leaveType').value,
                start: document.getElementById('dateStart').value,
                end: document.getElementById('dateEnd').value,
                reason: document.getElementById('leaveReason').value || '-'
            };
            
            if (!data.name || !data.empId || !data.start) return alert('กรอกข้อมูลไม่ครบถ้วน');
            
            btn.disabled = true; btn.innerText = "กำลังประมวลผล...";
            
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                alert('✅ ส่งใบลาสำเร็จ');
                location.reload();
            } catch (e) {
                alert('❌ เกิดข้อผิดพลาด');
                btn.disabled = false;
            }
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL + "?t=" + Date.now());
                rawData = await res.json();
                renderUI();
            } catch (e) { console.error("Error", e); }
        }

        function renderUI() {
            const empArea = document.getElementById('empList');
            const managerArea = document.getElementById('managerList');
            const rows = rawData.slice().reverse();

            // แสดงรายการสำหรับพนักงาน
            empArea.innerHTML = rows.map(r => `
                <div class="flex items-center justify-between p-5 bg-white rounded-[1.5rem] border border-slate-100 shadow-sm transition-all hover:border-indigo-200">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center font-bold text-indigo-600 text-xs border border-indigo-100">${r[0].charAt(0)}</div>
                        <div>
                            <div class="font-bold text-slate-800">${r[0]} <span class="text-[10px] text-slate-400 font-normal ml-1">#${r[1]}</span></div>
                            <div class="text-[10px] font-bold text-indigo-500 uppercase tracking-tighter">Line ${r[9]} | ${r[10]} | ${r[4]} - ${r[5]}</div>
                            <div class="text-[9px] text-slate-400 font-medium">${r[2]}</div>
                        </div>
                    </div>
                    <div class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase text-white ${r[7] === 'Approved' ? 'bg-emerald-500' : (r[7] === 'Rejected' ? 'bg-rose-500' : 'bg-amber-400')} shadow-sm">
                        ${r[7].replace(/_/g, ' ')}
                    </div>
                </div>`).join('');

            // กรองรายการสำหรับผู้อนุมัติ
            let filtered = [];
            if (['Assy', 'Elec', 'Pack'].includes(currentRole)) filtered = rows.filter(r => r[10] === currentRole && r[7] === "Pending");
            else if (currentRole === "Sup") filtered = rows.filter(r => r[7] === "Foreman_Approved");
            else if (currentRole === "Senior_Sup") filtered = rows.filter(r => r[7] === "Sup_Approved");
            else if (currentRole === "Asst_Chief") filtered = rows.filter(r => r[7] === "SeniorSup_Approved");
            else if (currentRole === "Manager") filtered = rows.filter(r => r[7] === "AsstChief_Approved");

            managerArea.innerHTML = filtered.map(r => `
                <div class="glass p-8 border-l-[12px] border-indigo-600 shadow-xl">
                    <div class="flex justify-between mb-4">
                        <div>
                            <h4 class="text-2xl font-black text-slate-900">${r[0]}</h4>
                            <p class="text-xs font-bold text-indigo-500">${r[2]}</p>
                        </div>
                        <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-xl text-xs font-bold uppercase h-fit tracking-widest">Line ${r[9]}</span>
                    </div>
                    <div class="bg-slate-50 p-5 rounded-3xl mb-6 text-sm">
                        <p class="mb-1 text-slate-400 font-bold uppercase text-[10px]">ช่วงวันลา:</p>
                        <p class="font-bold text-slate-700">${r[4]} ถึง ${r[5]}</p>
                        <p class="mt-4 text-slate-400 font-bold uppercase text-[10px]">เหตุผล:</p>
                        <p class="text-slate-600 italic">"${r[6]}"</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-50 hover:bg-emerald-600 transition-all">อนุมัติ</button>
                        <button onclick="updateStatus(${r[16]}, 'Rejected')" class="flex-1 bg-white border-2 border-rose-100 text-rose-500 py-4 rounded-2xl font-bold hover:bg-rose-50 transition-all text-xs uppercase">ปฏิเสธ</button>
                    </div>
                </div>`).join('');

            if(filtered.length === 0) managerArea.innerHTML = "<div class='col-span-full text-center text-slate-400 py-20 bg-white rounded-[3rem] border-2 border-dashed border-slate-200 font-bold'>🎉 ยอดเยี่ยม! ไม่มีคำค้างในระดับนี้</div>";
        }

        async function updateStatus(rowIdx, newStatus) {
            if(!confirm('ยืนยันรายการนี้?')) return;
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) });
                fetchData();
            } catch (e) { alert('เกิดข้อผิดพลาด'); }
        }
    </script>
</body>
</html>
