<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM SKY - CONNECTED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f9ff; }
        .page-section { display: none; }
        .active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .choice-input input:checked + .choice-box { border-color: #3b82f6; background-color: #eff6ff; color: #1d4ed8; }
        .choice-box { transition: all 0.2s; border: 2px solid transparent; background: white; }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 p-4 border-b border-blue-100 flex justify-between items-center px-8 shadow-sm">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="bg-blue-600 text-white p-2 rounded-xl shadow-lg"><i class="fa-solid fa-paper-plane"></i></div>
            <span class="text-xl font-extrabold tracking-tight">HRM <span class="text-blue-600">SKY</span></span>
        </div>
        <button id="backBtn" onclick="showPage('portal')" class="hidden text-blue-600 font-bold text-sm bg-white px-4 py-2 rounded-lg border">หน้าหลัก</button>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl mt-6">
        <div id="page-portal" class="page-section active text-center py-12">
            <h1 class="text-4xl font-extrabold mb-12 text-slate-900">เลือกโหมดการใช้งาน</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 px-4">
                <div onclick="showPage('employee')" class="bg-white p-12 rounded-[3rem] shadow-xl hover:scale-105 transition-all cursor-pointer border-b-8 border-blue-500">
                    <i class="fa-solid fa-user-edit text-5xl text-blue-500 mb-4"></i>
                    <h3 class="text-2xl font-bold">พนักงาน</h3>
                </div>
                <div onclick="showPage('login')" class="bg-slate-900 p-12 rounded-[3rem] shadow-xl hover:scale-105 transition-all cursor-pointer border-b-8 border-indigo-500">
                    <i class="fa-solid fa-user-shield text-5xl text-white mb-4"></i>
                    <h3 class="text-2xl font-bold text-white">ผู้อนุมัติ</h3>
                </div>
            </div>
        </div>

        <div id="page-employee" class="page-section">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-lg border border-blue-50">
                    <h3 class="text-xl font-bold mb-6 italic text-blue-600 underline">เขียนใบลา</h3>
                    <div class="space-y-4">
                        <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="w-full bg-slate-50 p-4 rounded-xl outline-none border">
                        <input type="text" id="empId" placeholder="รหัสพนักงาน" class="w-full bg-slate-50 p-4 rounded-xl outline-none border">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <label class="choice-input"><input type="radio" name="empStatus" value="ประจำ" class="hidden" checked><div class="choice-box p-3 rounded-xl text-center text-xs font-bold shadow-sm">ประจำ</div></label>
                            <label class="choice-input"><input type="radio" name="empStatus" value="ชั่วคราว" class="hidden"><div class="choice-box p-3 rounded-xl text-center text-xs font-bold shadow-sm">ชั่วคราว</div></label>
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            <label class="choice-input"><input type="radio" name="empLine" value="C" class="hidden" checked><div class="choice-box p-2 rounded-xl text-center text-[10px] font-bold shadow-sm">Line C</div></label>
                            <label class="choice-input"><input type="radio" name="empLine" value="E" class="hidden"><div class="choice-box p-2 rounded-xl text-center text-[10px] font-bold shadow-sm">Line E</div></label>
                            <label class="choice-input"><input type="radio" name="empLine" value="Common" class="hidden"><div class="choice-box p-2 rounded-xl text-center text-[10px] font-bold shadow-sm">Common</div></label>
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            <label class="choice-input"><input type="radio" name="leaveTypeChoice" value="ลาป่วย" class="hidden" checked><div class="choice-box p-3 rounded-xl text-center text-xs font-bold shadow-sm">ลาป่วย</div></label>
                            <label class="choice-input"><input type="radio" name="leaveTypeChoice" value="ลากิจ" class="hidden"><div class="choice-box p-3 rounded-xl text-center text-xs font-bold shadow-sm">ลากิจ</div></label>
                            <label class="choice-input"><input type="radio" name="leaveTypeChoice" value="ลาพักร้อน" class="hidden"><div class="choice-box p-3 rounded-xl text-center text-xs font-bold shadow-sm">พักร้อน</div></label>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-xs font-bold text-slate-400">
                            <div>เริ่ม <input type="date" id="dateStart" class="w-full p-3 rounded-xl border bg-slate-50 mt-1"></div>
                            <div>ถึง <input type="date" id="dateEnd" class="w-full p-3 rounded-xl border bg-slate-50 mt-1"></div>
                        </div>

                        <textarea id="leaveReason" placeholder="เหตุผล..." class="w-full bg-slate-50 p-4 rounded-xl h-24 border"></textarea>
                        
                        <div class="bg-blue-50 p-4 rounded-xl border-2 border-dashed border-blue-200">
                            <p class="text-[10px] font-bold text-blue-500 mb-2">แนบรูปภาพหลักฐาน</p>
                            <input type="file" id="fileInput" accept="image/*" class="text-xs w-full">
                        </div>

                        <button onclick="submitLeave()" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-100">ยืนยันส่งใบลา</button>
                    </div>
                </div>

                <div class="bg-white/50 p-6 rounded-[2.5rem] shadow-inner overflow-hidden">
                    <h3 class="font-bold mb-4">ประวัติล่าสุด</h3>
                    <div id="empList" class="space-y-3 h-[600px] overflow-y-auto"></div>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section">
            <div class="bg-white p-10 max-w-md mx-auto rounded-[2rem] shadow-xl text-center mt-12 border-t-8 border-indigo-600">
                <h3 class="text-2xl font-bold mb-6">รหัสผ่านผู้อนุมัติ</h3>
                <input type="password" id="adminPass" class="w-full p-4 rounded-xl border bg-slate-50 text-center text-2xl tracking-widest mb-6">
                <button onclick="checkLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">เข้าสู่ระบบ</button>
            </div>
        </div>

        <div id="page-approver" class="page-section">
            <div class="flex justify-between items-center mb-6 bg-white p-6 rounded-2xl shadow-sm">
                <h2 class="text-xl font-bold" id="roleBadge">ผู้อนุมัติ</h2>
                <button onclick="fetchData()" class="text-blue-600 font-bold"><i class="fa-solid fa-sync"></i> อัปเดต</button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyxbkXTqCfUPCbQBq3ZtKjMNSvCRKsomda_5-J2ElsPApZ2VvxRpESOuHIL972vemv0/exec';
        let currentRole = "";
        let rawData = [];

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('backBtn').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'approver') fetchData();
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            const roles = {'7843':'Assy','1332':'Elec','80006':'Pack','7605':'Sup','9764':'Manager'};
            if(roles[pass]) { currentRole = roles[pass]; document.getElementById('roleBadge').innerText = "ระดับ: "+currentRole; showPage('approver'); }
            else alert('รหัสผิด');
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('fileInput');
            let fileObj = null;

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                fileObj = await new Promise(r => {
                    reader.onload = e => r({base64: e.target.result.split(',')[1], type: file.type, name: file.name});
                    reader.readAsDataURL(file);
                });
            }

            const data = {
                action: 'addLeave',
                name: document.getElementById('empName').value,
                empId: document.getElementById('empId').value,
                empStatus: document.querySelector('input[name="empStatus"]:checked').value,
                line: document.querySelector('input[name="empLine"]:checked').value,
                process: "Assy", // ตัวอย่าง
                leaveType: document.querySelector('input[name="leaveTypeChoice"]:checked').value,
                start: document.getElementById('dateStart').value,
                end: document.getElementById('dateEnd').value,
                reason: document.getElementById('leaveReason').value || '-',
                file: fileObj
            };

            if(!data.name || !data.empId || !data.start) return alert('กรอกข้อมูลไม่ครบ');
            btn.disabled = true; btn.innerText = "กำลังส่ง...";

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
                .then(() => { alert('ส่งใบลาแล้ว'); location.reload(); })
                .catch(() => { alert('สำเร็จ (แต่ติด No-Cors)'); location.reload(); });
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL);
                rawData = await res.json();
                renderUI();
            } catch (e) { console.error("Error fetching", e); }
        }

        function renderUI() {
            const empArea = document.getElementById('empList');
            const managerArea = document.getElementById('managerList');
            const rows = rawData.slice().reverse();

            empArea.innerHTML = rows.map(r => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-50 flex justify-between items-center">
                    <div><div class="font-bold text-sm">${r[0]}</div><div class="text-[10px] text-blue-500">${r[3]} | ${r[4]}</div></div>
                    <div class="text-[9px] font-bold px-3 py-1 rounded-full text-white ${r[7]==='Approved'?'bg-green-500':'bg-amber-500'}">${r[7]}</div>
                </div>
            `).join('');

            const filtered = rows.filter(r => r[7].indexOf('Approved') === -1 && r[7] !== 'Rejected');
            managerArea.innerHTML = filtered.map(r => `
                <div class="bg-white p-6 rounded-[2rem] shadow-lg border-l-8 border-blue-600">
                    <h4 class="font-bold">${r[0]} (${r[1]})</h4>
                    <p class="text-xs text-slate-500 mb-4">${r[3]} : ${r[4]} ถึง ${r[5]}</p>
                    ${r[12] ? `<a href="${r[12]}" target="_blank" class="text-blue-600 text-xs font-bold block mb-4 underline">ดูรูปหลักฐาน</a>` : ''}
                    <div class="flex gap-2">
                        <button onclick="updateStatus(${r[11]}, 'Approved')" class="flex-1 bg-green-500 text-white py-2 rounded-xl text-xs font-bold">อนุมัติ</button>
                        <button onclick="updateStatus(${r[11]}, 'Rejected')" class="flex-1 bg-red-500 text-white py-2 rounded-xl text-xs font-bold">ปฏิเสธ</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(idx, status) {
            if(!confirm('ยืนยัน?')) return;
            fetch(scriptURL, { method: 'POST', body: JSON.stringify({action:'updateStatus', rowIdx: idx, status: status, role: currentRole}) })
            .then(() => fetchData());
        }
    </script>
</body>
</html>
