<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave System v4 (Final Fix)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold cursor-pointer" onclick="window.location.reload()">
            <i class="fa-solid fa-calendar-check mr-2"></i>ระบบลางาน
        </h1>
        <button id="homeBtn" onclick="showPage('portal')" class="hidden bg-white/20 px-4 py-1 rounded">กลับหน้าหลัก</button>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl">

        <div id="page-portal" class="mt-20">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-gray-800">ยินดีต้อนรับ</h2>
                <p class="text-gray-500">เลือกโหมดการใช้งาน</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-3xl mx-auto">
                <div onclick="showPage('employee')" class="bg-white p-10 rounded-2xl shadow-md border-2 border-transparent hover:border-blue-500 cursor-pointer text-center transition-all active:scale-95">
                    <i class="fa-solid fa-user-edit text-5xl text-blue-600 mb-4"></i>
                    <h3 class="text-xl font-bold">สำหรับพนักงาน</h3>
                    <p class="text-sm text-gray-400 mt-2">กรอกข้อมูลการลา (ไม่ต้อง Login)</p>
                </div>
                <div onclick="showPage('login')" class="bg-white p-10 rounded-2xl shadow-md border-2 border-transparent hover:border-blue-900 cursor-pointer text-center transition-all active:scale-95">
                    <i class="fa-solid fa-user-shield text-5xl text-gray-700 mb-4"></i>
                    <h3 class="text-xl font-bold">สำหรับผู้อนุมัติ</h3>
                    <p class="text-sm text-gray-400 mt-2">จัดการคำร้อง (ต้อง Login)</p>
                </div>
            </div>
        </div>

        <div id="page-login" class="hidden mt-20 max-w-md mx-auto">
            <div class="bg-white p-8 rounded-xl shadow-lg border">
                <h2 class="text-2xl font-bold text-center mb-6">Login ผู้อนุมัติ</h2>
                <input type="text" id="user" placeholder="ชื่อผู้ใช้งาน" class="w-full border p-3 rounded mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="password" id="pass" placeholder="รหัสผ่าน" class="w-full border p-3 rounded mb-6 focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="handleLogin()" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold">เข้าสู่ระบบ</button>
            </div>
        </div>

        <div id="page-employee" class="hidden mt-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow border">
                    <h3 class="text-lg font-bold mb-4 border-b pb-2">แจ้งลาหยุด</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm font-bold">ประเภทพนักงาน</label>
                            <div class="flex gap-2 mt-1">
                                <button onclick="setEmpType(this)" class="emp-type-btn flex-1 border-2 border-blue-500 bg-blue-50 p-2 rounded text-sm">พนักงานชั่วคราว</button>
                                <button onclick="setEmpType(this)" class="emp-type-btn flex-1 border-2 border-gray-200 p-2 rounded text-sm">พนักงานประจำ</button>
                            </div>
                        </div>
                        <input type="text" id="nameInp" placeholder="ชื่อ-นามสกุล" class="w-full border p-2 rounded">
                        <select id="typeInp" onchange="checkReason(this.value)" class="w-full border p-2 rounded">
                            <option value="ลาพักร้อน">ลาพักร้อน</option>
                            <option value="ลาป่วย">ลาป่วย</option>
                            <option value="ลากิจ">ลากิจ</option>
                        </select>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="dateS" class="border p-2 rounded text-sm">
                            <input type="date" id="dateE" class="border p-2 rounded text-sm">
                        </div>
                        <div id="reasonArea" class="hidden">
                            <textarea id="reasonInp" placeholder="ระบุเหตุผล (บังคับสำหรับการลากิจ)" class="w-full border p-2 rounded"></textarea>
                        </div>
                        <button onclick="submitLeave()" class="w-full bg-blue-800 text-white py-2 rounded font-bold">ส่งข้อมูล</button>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border">
                    <h3 class="text-lg font-bold mb-4 border-b pb-2">ประวัติล่าสุด</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-gray-50 text-left">
                                <tr>
                                    <th class="p-3">ชื่อ</th>
                                    <th class="p-3">ประเภท</th>
                                    <th class="p-3">วันที่</th>
                                    <th class="p-3 text-center">สถานะ</th>
                                </tr>
                            </thead>
                            <tbody id="empTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="hidden mt-6">
            <div class="bg-white p-6 rounded-xl shadow border mb-6 flex justify-between items-center">
                <h2 class="text-xl font-bold">แดชบอร์ดผู้อนุมัติ</h2>
                <button onclick="exportData()" class="bg-green-600 text-white px-4 py-2 rounded text-sm">Export ข้อมูล</button>
            </div>
            <div class="bg-white rounded-xl shadow border overflow-hidden">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100 font-bold">
                        <tr>
                            <th class="p-4">พนักงาน</th>
                            <th class="p-4">ประเภทลา</th>
                            <th class="p-4">วันที่</th>
                            <th class="p-4 text-center">สถานะ</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="appTable" class="divide-y"></tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-[99]">
        <div class="bg-white rounded-xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4 border-b pb-2">รายละเอียด</h3>
            <div id="modalContent" class="space-y-2 text-sm"></div>
            <div class="flex gap-2 mt-6">
                <button onclick="changeStatus('Approved')" class="flex-1 bg-green-600 text-white py-2 rounded">อนุมัติ</button>
                <button onclick="changeStatus('Rejected')" class="flex-1 bg-red-600 text-white py-2 rounded">ปฏิเสธ</button>
            </div>
            <button onclick="document.getElementById('modal').style.display='none'" class="w-full mt-2 text-gray-400">ปิด</button>
        </div>
    </div>

    <script>
        let currentType = "พนักงานชั่วคราว";
        let viewId = null;

        // ฟังก์ชันเปลี่ยนหน้า (ใช้ style.display โดยตรงเพื่อความชัวร์)
        function showPage(pageId) {
            const pages = ['portal', 'login', 'employee', 'approver'];
            pages.forEach(p => {
                document.getElementById('page-' + p).style.display = 'none';
            });
            document.getElementById('page-' + pageId).style.display = 'block';
            document.getElementById('homeBtn').style.display = (pageId === 'portal') ? 'none' : 'block';

            if(pageId === 'employee') renderEmp();
            if(pageId === 'approver') renderApp();
        }

        function setEmpType(btn) {
            document.querySelectorAll('.emp-type-btn').forEach(b => {
                b.classList.remove('border-blue-500', 'bg-blue-50');
                b.classList.add('border-gray-200');
            });
            btn.classList.add('border-blue-500', 'bg-blue-50');
            currentType = btn.innerText;
        }

        function checkReason(val) {
            document.getElementById('reasonArea').style.display = (val === 'ลากิจ') ? 'block' : 'none';
        }

        function handleLogin() {
            // จำลองการล็อกอิน
            showPage('approver');
        }

        function submitLeave() {
            const name = document.getElementById('nameInp').value;
            const lType = document.getElementById('typeInp').value;
            const s = document.getElementById('dateS').value;
            const e = document.getElementById('dateE').value;
            const res = document.getElementById('reasonInp').value;

            if(!name || !s || !e) return alert('กรุณากรอกข้อมูลให้ครบ');
            if(lType === 'ลากิจ' && !res) return alert('กรุณาระบุเหตุผลสำหรับการลากิจ');

            const leaves = JSON.parse(localStorage.getItem('leaves_v4') || '[]');
            leaves.push({ id: Date.now(), name, empType: currentType, lType, s, e, res: res || '-', status: 'Pending' });
            localStorage.setItem('leaves_v4', JSON.stringif
