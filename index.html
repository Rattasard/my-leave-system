<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลางาน v.Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background: #f8fafc; }
        .page-section { display: none; }
        .page-active { display: block !important; }
    </style>
</head>
<body>

    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="font-bold text-lg">ระบบจัดการการลา</h1>
        <button id="backBtn" onclick="changePage('portal')" class="hidden border border-white/50 px-3 py-1 rounded text-sm hover:bg-white/10">กลับหน้าหลัก</button>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl">
        <div id="page-portal" class="page-section page-active mt-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto">
                <div onclick="changePage('employee')" class="bg-white p-8 rounded-2xl shadow-sm border hover:border-blue-500 cursor-pointer text-center transition-all">
                    <i class="fa-solid fa-user text-4xl text-blue-600 mb-4"></i>
                    <h3 class="font-bold">หน้าพนักงาน</h3>
                </div>
                <div onclick="changePage('login')" class="bg-white p-8 rounded-2xl shadow-sm border hover:border-gray-800 cursor-pointer text-center transition-all">
                    <i class="fa-solid fa-user-check text-4xl text-gray-700 mb-4"></i>
                    <h3 class="font-bold">ผู้อนุมัติ</h3>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section mt-10 max-w-sm mx-auto">
            <div class="bg-white p-6 rounded-xl shadow-sm border text-center">
                <h2 class="font-bold mb-4">Login ผู้อนุมัติ</h2>
                <input type="password" id="adminPass" placeholder="รหัสผ่าน" class="w-full border p-2 rounded mb-4 text-center">
                <button onclick="handleLogin()" class="w-full bg-blue-900 text-white py-2 rounded font-bold">เข้าสู่ระบบ</button>
            </div>
        </div>

        <div id="page-employee" class="page-section mt-4">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-xl border shadow-sm h-fit">
                    <h3 class="font-bold mb-4 text-blue-900 border-b pb-2">บันทึกการลา</h3>
                    <div class="space-y-3">
                        <input type="text" id="empName" placeholder="ชื่อ-นามสกุล *" class="w-full border p-2 rounded text-sm">
                        <input type="text" id="empId" placeholder="รหัสพนักงาน *" class="w-full border p-2 rounded text-sm">
                        <select id="empStatus" class="w-full border p-2 rounded text-sm bg-gray-50">
                            <option value="พนักงานประจำ">1. ประจำ</option>
                            <option value="พนักงานชั่วคราว">2. ชั่วคราว</option>
                        </select>
                        <select id="leaveType" class="w-full border p-2 rounded text-sm bg-gray-50">
                            <option value="ลาป่วย">ลาป่วย</option>
                            <option value="ลากิจ">ลากิจ</option>
                            <option value="ลาพักร้อน">ลาพักร้อน</option>
                        </select>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="dateStart" class="border p-2 rounded text-xs">
                            <input type="date" id="dateEnd" class="border p-2 rounded text-xs">
                        </div>
                        <textarea id="leaveReason" placeholder="เหตุผล" class="w-full border p-2 rounded text-sm h-20"></textarea>
                        <button onclick="saveLeave()" id="submitBtn" class="w-full bg-blue-800 text-white py-2 rounded font-bold hover:bg-blue-700">ส่งคำขอ</button>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-white p-5 rounded-xl border shadow-sm">
                    <h3 class="font-bold mb-4 border-b pb-2">ประวัติและสถานะ</h3>
                    <div id="empStatusList">กำลังโหลดข้อมูล...</div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="page-section mt-4">
            <h2 class="font-bold text-xl mb-4 text-blue-900">รายการรอนุมัติ</h2>
            <div id="approverList" class="space-y-3">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script>
        // *** สำคัญ: เปลี่ยน URL เป็น URL ของคุณ ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxoJiLuymI5gK1392VbDlUSuIrP0VUPtOD3E34MT1YukuxmX39jpcKp4FEGDWnEvVbp/exec';

        function changePage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('page-active'));
            document.getElementById('page-' + pageId).classList.add('page-active');
            document.getElementById('backBtn').classList.toggle('hidden', pageId === 'portal');
            if(pageId === 'employee' || pageId === 'approver') loadData();
        }

        function handleLogin() {
            if(document.getElementById('adminPass').value === '1234') changePage('approver');
            else alert('รหัสผ่านไม่ถูกต้อง');
        }

        async function saveLeave() {
            const btn = document.getElementById('submitBtn');
            const data = { action: 'addLeave', name: document.getElementById('empName').value, empId: document.getElementById('empId').value, empStatus: document.getElementById('empStatus').value, leaveType: document.getElementById('leaveType').value, start: document.getElementById('dateStart').value, end: document.getElementById('dateEnd').value, reason: document.getElementById('leaveReason').value || '-' };
            if(!data.name || !data.start) return alert('กรุณากรอกชื่อและวันที่เริ่มลา');
            btn.disabled = true; btn.innerText = 'กำลังส่ง...';
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            alert('ส่งข้อมูลสำเร็จ!');
            window.location.reload();
        }

        async function loadData() {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                renderTables(data);
            } catch (e) { console.error(e); }
        }

        function renderTables(data) {
            const empArea = document.getElementById('empStatusList');
            const appArea = document.getElementById('approverList');
            const rows = data.slice().reverse();

            // แสดงหน้าพนักงาน
            empArea.innerHTML = `<table class="w-full text-sm border">
                <thead class="bg-gray-50"><tr><th class="p-2 border">ชื่อ / ประเภท</th><th class="p-2 border">วันที่</th><th class="p-2 border">สถานะ</th></tr></thead>
                <tbody>${rows.map(r => `<tr>
                    <td class="p-2 border"><b>${r[0]}</b><br><small class="text-blue-500">${r[2]}</small></td>
                    <td class="p-2 border text-xs">${r[4]}</td>
                    <td class="p-2 border text-center font-bold ${r[7]==='Approved'?'text-green-600':(r[7]==='Rejected'?'text-red-600':'text-amber-500')}">${r[7]}</td>
                </tr>`).join('')}</tbody>
            </table>`;

            // แสดงหน้าผู้อนุมัติ
            appArea.innerHTML = rows.map((r, i) => `
                <div class="bg-white p-4 rounded-lg border-l-4 ${r[7]==='Approved'?'border-green-500':(r[7]==='Rejected'?'border-red-500':'border-amber-500')} shadow-sm flex justify-between items-center">
                    <div>
                        <div class="font-bold">${r[0]} <span class="text-xs font-normal text-gray-500">(${r[2]})</span></div>
                        <div class="text-sm text-blue-800">${r[3]}: ${r[4]}</div>
                    </div>
                    <div>
                        ${r[7] === 'Pending' ? `
                            <button onclick="updateStatus('${r[0]}','${r[4]}','Approved')" class="bg-green-600 text-white px-3 py-1 rounded text-xs mr-1">อนุมัติ</button>
                            <button onclick="updateStatus('${r[0]}','${r[4]}','Rejected')" class="bg-red-600 text-white px-3 py-1 rounded text-xs">ปฏิเสธ</button>
                        ` : `<span class="font-bold ${r[7]==='Approved'?'text-green-600':'text-red-600'}">${r[7]}</span>`}
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(name, start, status) {
            if(!confirm(`ยืนยันการ ${status}?`)) return;
            try {
                // ส่งคำขอ POST เพื่ออัปเดต Sheet
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'updateStatus', name: name, start: start, status: status })
                });
                
                alert('บันทึกเรียบร้อย!');
                loadData(); // บังคับรีโหลดข้อมูลใหม่ทันที
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
