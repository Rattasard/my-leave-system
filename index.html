<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM SKY | Executive Earth Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap');
        
        :root {
            --base-dark: #1a1614; /* น้ำตาลเข้มเกือบดำ */
            --panel-dark: #2a2421; /* น้ำตาลกาแฟ */
            --accent-gold: #c5a67c; /* ทองแชมเปญ */
            --text-soft: #d1cbc5;
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; 
            background-color: var(--base-dark);
            color: var(--text-soft);
            min-height: 100vh;
        }

        /* --- Glassmorphism & Depth --- */
        .glass-panel {
            background: rgba(42, 36, 33, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 166, 124, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- Input Premium (Rounded & Warm) --- */
        .input-luxe {
            @apply w-full p-4 px-8 rounded-[2rem] outline-none transition-all duration-300 text-[15px];
            background: rgba(26, 22, 20, 0.8);
            border: 1px solid rgba(197, 166, 124, 0.15);
            color: white;
        }
        .input-luxe:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(197, 166, 124, 0.1);
        }

        /* --- Pill Buttons (Earth Tone) --- */
        .pill-choice {
            @apply flex items-center justify-center gap-3 p-3.5 px-7 rounded-full transition-all duration-300 cursor-pointer border;
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(197, 166, 124, 0.1);
            color: #8c837d;
        }
        .choice-input:checked + .pill-choice {
            background: var(--accent-gold);
            color: var(--base-dark);
            border-color: var(--accent-gold);
            font-weight: 800;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(197, 166, 124, 0.3);
        }

        /* --- History Card (Inspired by your images) --- */
        .history-card {
            @apply p-6 rounded-[2.5rem] border transition-all flex justify-between items-center mb-5;
            background: rgba(42, 36, 33, 0.4);
            border-color: rgba(197, 166, 124, 0.05);
        }
        .history-card:hover {
            border-color: rgba(197, 166, 124, 0.3);
            background: rgba(42, 36, 33, 0.8);
            transform: translateX(-5px);
        }

        .label-luxe {
            @apply text-[10px] font-black uppercase tracking-[0.3em] text-amber-200/40 mb-3 ml-8 block;
        }

        .view-section { display: none; }
        .view-active { display: block; animation: smoothIn 0.8s ease; }
        @keyframes smoothIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="p-8 px-12 flex justify-between items-center sticky top-0 z-50 bg-base-dark/80 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-4 cursor-pointer" onclick="showView('portal')">
            <div class="w-12 h-12 bg-[#c5a67c] rounded-2xl flex items-center justify-center text-[#1a1614] text-2xl shadow-xl">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <span class="text-2xl font-black tracking-tighter uppercase italic text-white">HRM <span class="text-[#c5a67c]">EARTH</span></span>
        </div>
        <div id="navActions" class="hidden flex gap-4">
            <button onclick="showView('portal')" class="px-6 py-2 rounded-full border border-amber-200/20 text-[10px] font-bold uppercase tracking-widest hover:bg-white/5 transition-all">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Portal
            </button>
        </div>
    </nav>

    <div class="container mx-auto max-w-7xl p-6 pt-10">

        <div id="view-portal" class="view-section view-active py-24 text-center">
            <h1 class="text-7xl font-black text-white mb-6 tracking-tighter">Pure <span class="text-[#c5a67c] italic">Management.</span></h1>
            <p class="text-amber-100/40 mb-20 text-xl font-light max-w-2xl mx-auto">ระบบจัดการพนักงานที่เน้นความเรียบง่ายและเป็นธรรมชาติที่สุด</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-4xl mx-auto">
                <div onclick="showView('employee')" class="glass-panel p-16 rounded-[4rem] group cursor-pointer transition-all hover:-translate-y-4">
                    <div class="w-24 h-24 bg-amber-200/5 text-[#c5a67c] rounded-[2.5rem] flex items-center justify-center mx-auto mb-10 group-hover:bg-[#c5a67c] group-hover:text-black transition-all shadow-inner"><i class="fa-solid fa-feather text-4xl"></i></div>
                    <h3 class="text-3xl font-black text-white">Staff Entry</h3>
                    <p class="text-amber-100/30 mt-4 italic">ส่งคำขอลาและดูสถานะล่าสุด</p>
                </div>
                <div onclick="showView('login')" class="bg-[#c5a67c] p-16 rounded-[4rem] group cursor-pointer transition-all hover:-translate-y-4">
                    <div class="w-24 h-24 bg-[#1a1614] text-[#c5a67c] rounded-[2.5rem] flex items-center justify-center mx-auto mb-10"><i class="fa-solid fa-key text-4xl"></i></div>
                    <h3 class="text-3xl font-black text-[#1a1614]">Manager Hub</h3>
                    <p class="text-[#1a1614]/50 mt-4 italic">ส่วนงานบริหารและอนุมัติรายการ</p>
                </div>
            </div>
        </div>

        <div id="view-employee" class="view-section">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <div class="lg:col-span-7 glass-panel p-10 md:p-14 rounded-[4rem]">
                    <div class="flex items-center gap-5 mb-14">
                        <div class="w-2 h-10 bg-[#c5a67c] rounded-full"></div>
                        <h2 class="text-4xl font-black text-white tracking-tighter italic">Leave Request</h2>
                    </div>

                    <div class="space-y-12">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div><label class="label-luxe">Employee Name</label><input type="text" id="empName" placeholder="Full Name" class="input-luxe"></div>
                            <div><label class="label-luxe">Staff ID</label><input type="text" id="empId" placeholder="ID-0000" class="input-luxe"></div>
                        </div>

                        <div>
                            <label class="label-luxe">Employment</label>
                            <div class="flex flex-wrap gap-4">
                                <label><input type="radio" name="empStatus" value="ประจำ" class="hidden choice-input" checked><div class="pill-choice">Permanent</div></label>
                                <label><input type="radio" name="empStatus" value="ชั่วคราว" class="hidden choice-input"><div class="pill-choice">Contract</div></label>
                            </div>
                        </div>

                        <div>
                            <label class="label-luxe">Production Line</label>
                            <div class="flex flex-wrap gap-3">
                                <label><input type="radio" name="empLine" value="Line C" class="hidden choice-input" checked><div class="pill-choice">Line C</div></label>
                                <label><input type="radio" name="empLine" value="Line E" class="hidden choice-input"><div class="pill-choice">Line E</div></label>
                                <label><input type="radio" name="empLine" value="Office" class="hidden choice-input"><div class="pill-choice">Office</div></label>
                                <label><input type="radio" name="empLine" value="Common" class="hidden choice-input"><div class="pill-choice">Common</div></label>
                            </div>
                        </div>

                        <div>
                            <label class="label-luxe">Leave Category</label>
                            <div class="flex flex-wrap gap-4">
                                <label><input type="radio" name="leaveType" value="ลาป่วย" class="hidden choice-input" checked><div class="pill-choice"><i class="fa-solid fa-heart-pulse"></i> Sick Leave</div></label>
                                <label><input type="radio" name="leaveType" value="ลากิจ" class="hidden choice-input"><div class="pill-choice"><i class="fa-solid fa-briefcase"></i> Personal</div></label>
                                <label><input type="radio" name="leaveType" value="ลาพักร้อน" class="hidden choice-input"><div class="pill-choice"><i class="fa-solid fa-sun"></i> Vacation</div></label>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-10">
                            <div><label class="label-luxe">Start Date</label><input type="date" id="dateStart" class="input-luxe"></div>
                            <div><label class="label-luxe">End Date</label><input type="date" id="dateEnd" class="input-luxe"></div>
                        </div>

                        <div><label class="label-luxe">Reason / เหตุผล</label><textarea id="leaveReason" placeholder="Brief details..." class="input-luxe h-32 resize-none py-6"></textarea></div>

                        <button onclick="submitLeave()" id="submitBtn" class="w-full py-7 rounded-full bg-[#c5a67c] text-[#1a1614] font-black text-sm uppercase tracking-[0.5em] shadow-2xl transition-all active:scale-95">Verify & Send</button>
                    </div>
                </div>

                <div class="lg:col-span-5">
                    <div class="flex items-center justify-between mb-10 px-8">
                        <h3 class="text-2xl font-black text-white tracking-tight italic">Recent History</h3>
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-[#c5a67c] rounded-full animate-pulse"></span>
                            <span class="text-[10px] font-bold text-amber-200/30 uppercase tracking-widest">Real-Time</span>
                        </div>
                    </div>
                    <div id="historyList" class="space-y-4 overflow-y-auto max-h-[1000px] no-scrollbar px-2 pb-20">
                        </div>
                </div>
            </div>
        </div>

        <div id="view-login" class="view-section">
            <div class="max-w-md mx-auto mt-24 glass-panel p-16 rounded-[4rem] text-center border-amber-200/10">
                <div class="w-20 h-20 bg-amber-200/5 text-[#c5a67c] rounded-[2rem] flex items-center justify-center mx-auto mb-10"><i class="fa-solid fa-fingerprint text-3xl"></i></div>
                <h3 class="text-3xl font-black mb-10 text-white">Manager Key</h3>
                <input type="password" id="adminPass" placeholder="••••" class="input-luxe text-center text-4xl tracking-[0.8em] mb-12">
                <button onclick="checkLogin()" class="w-full py-6 rounded-full bg-[#c5a67c] text-[#1a1614] font-black text-sm uppercase tracking-widest shadow-2xl transition-all">Authorize Hub</button>
            </div>
        </div>

        <div id="view-manager" class="view-section">
            <div class="flex flex-col md:flex-row justify-between items-end mb-20 gap-8">
                <div>
                    <h2 class="text-7xl font-black text-white tracking-tighter italic">Review Hub</h2>
                    <div id="roleBadge" class="mt-4 px-8 py-2.5 bg-amber-200/10 text-[#c5a67c] text-[10px] font-black rounded-full uppercase tracking-widest inline-block border border-amber-200/10"></div>
                </div>
                <button onclick="fetchData()" class="w-20 h-20 bg-white/5 rounded-full text-[#c5a67c] border border-white/5 shadow-2xl hover:rotate-180 transition-all duration-1000 flex items-center justify-center"><i class="fa-solid fa-arrows-rotate text-2xl"></i></button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-12"></div>
        </div>

    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwY6mRSha_DXHVR9umv4qTg1bDo8g3fqVq9yvwJakBuVEdayGRinSKPzA8zdivWapFR/exec';
        let currentRole = "";
        let rawData = [];

        function showView(id) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            document.getElementById('navActions').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'manager') fetchData();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            const roles = {'7843':'Assy','1332':'Elec','80006':'Pack','7605':'Sup','9764':'Manager'};
            if(roles[pass]) { currentRole = roles[pass]; document.getElementById('roleBadge').innerText = "Context: " + currentRole; showView('manager'); }
            else { alert('Unauthorized Access'); }
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const data = {
                action: 'addLeave',
                NAME: document.getElementById('empName').value,
                ID: document.getElementById('empId').value,
                EMP_STATUS: document.querySelector('input[name="empStatus"]:checked').value,
                LEAVE_TYPE: document.querySelector('input[name="leaveType"]:checked').value,
                LINE: document.querySelector('input[name="empLine"]:checked').value,
                PROCESS: "COMMON",
                START: document.getElementById('dateStart').value,
                END: document.getElementById('dateEnd').value,
                REASON: document.getElementById('leaveReason').value || '-',
                FILE: null
            };

            if(!data.NAME || !data.ID) return alert('กรุณากรอกข้อมูลให้ครบ');
            btn.disabled = true; btn.innerText = "Transmitting...";

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => { alert('ส่งคำขอลาสำเร็จ'); location.reload(); })
            .catch(() => { alert('Error'); btn.disabled = false; });
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL);
                rawData = await res.json();
                renderUI();
            } catch (err) { console.error("API Error"); }
        }

        function renderUI() {
            const histArea = document.getElementById('historyList');
            const managerArea = document.getElementById('managerList');
            const sorted = rawData.slice().reverse();

            // Employee Feed
            histArea.innerHTML = sorted.map(r => `
                <div class="history-card">
                    <div>
                        <div class="text-xl font-extrabold text-white tracking-tight">${r[0]}</div>
                        <div class="text-[10px] font-black text-amber-200/40 uppercase mt-1 tracking-widest">${r[3]} • ${r[9]}</div>
                    </div>
                    <div class="px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest border ${r[7]==='Approved'?'border-emerald-500/20 text-emerald-500 bg-emerald-500/5':'border-amber-200/10 text-[#c5a67c] bg-amber-200/5'}">
                        ${r[7]}
                    </div>
                </div>`).join('');

            // Manager Feed
            const pending = sorted.filter(r => r[7] === 'Pending');
            managerArea.innerHTML = pending.map(r => `
                <div class="glass-panel p-14 rounded-[5rem] border-white/5 relative overflow-hidden group">
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-amber-200/5 rounded-full blur-3xl"></div>
                    <span class="text-[10px] font-black text-[#c5a67c] uppercase tracking-widest">${r[3]} Request</span>
                    <h4 class="text-4xl font-black text-white mt-4">${r[0]}</h4>
                    <p class="text-xs font-bold text-amber-100/20 mt-2 uppercase">Dept: ${r[10]} • Line: ${r[9]}</p>
                    <div class="my-10 p-10 bg-black/40 rounded-[3.5rem] text-amber-100/60 italic border border-white/5 font-medium leading-relaxed">"${r[6]}"</div>
                    <div class="flex gap-4">
                        <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-grow bg-[#c5a67c] text-[#1a1614] py-6 rounded-full font-black text-[11px] uppercase tracking-widest transition-all hover:bg-white">Approve</button>
                        <button onclick="updateStatus(${r[16]}, 'Rejected')" class="px-10 bg-white/5 text-amber-200/20 py-6 rounded-full font-black text-[11px] uppercase tracking-widest border border-white/5 hover:text-rose-500 transition-all">Decline</button>
                    </div>
                </div>`).join('');
            
            if(pending.length === 0) managerArea.innerHTML = "<div class='col-span-full py-40 text-center opacity-20'><i class='fa-solid fa-campground text-8xl mb-8'></i><p class='font-black uppercase tracking-[0.5em]'>No Pending Items</p></div>";
        }

        async function updateStatus(rowIdx, newStatus) {
            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) 
            }).then(() => fetchData());
        }
    </script>
</body>
</html>
