<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลางาน v.Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .page-section { display: none !important; }
        .page-active { display: block !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold cursor-pointer" onclick="window.location.reload()">ระบบลางาน</h1>
        <button id="backBtn" onclick="changePage('portal')" class="hidden bg-white/20 px-4 py-1 rounded text-sm">กลับหน้าหลัก</button>
    </nav>

    <div class="container mx-auto p-4">
        <div id="page-portal" class="page-section page-active mt-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto">
                <div onclick="changePage('employee')" class="bg-white p-10 rounded-xl shadow border-2 hover:border-blue-500 cursor-pointer text-center transition-all">
                    <i class="fa-solid fa-user-edit text-5xl text-blue-600 mb-4"></i>
                    <h3 class="text-xl font-bold">สำหรับพนักงาน</h3>
                </div>
                <div onclick="changePage('login')" class="bg-white p-10 rounded-xl shadow border-2 hover:border-gray-800 cursor-pointer text-center transition-all">
                    <i class="fa-solid fa-user-shield text-5xl text-gray-700 mb-4"></i>
                    <h3 class="text-xl font-bold">สำหรับผู้อนุมัติ</h3>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section mt-10 max-w-md mx-auto text-center">
            <div class="bg-white p-8 rounded-xl shadow">
                <h2 class="text-xl font-bold mb-4">เข้าระบบผู้อนุมัติ</h2>
                <input type="password" id="adminPass" placeholder="รหัสผ่าน (1234)" class="w-full border p-3 rounded mb-4">
                <button onclick="handleLogin()" class="w-full bg-blue-900 text-white py-3 rounded font-bold">ยืนยัน</button>
            </div>
        </div>

        <div id="page-employee" class="page-section mt-4">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow border">
                    <h3 class="font-bold mb-4 border-b pb-2">แจ้งลา</h3>
                    <div class="space-y-3">
                        <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="w-full border p-2 rounded">
                        <input type="text" id="empId" placeholder="รหัสพนักงาน" class="w-full border p-2 rounded">
                        <select id="empStatus" class="w-full border p-2 rounded"><option>พนักงานประจำ</option><option>พนักงานชั่วคราว</option></select>
                        <select id="leaveType" class="w-full border p-2 rounded"><option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option></select>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="dateStart" class="w-full border p-2 rounded text-sm">
                            <input type="date" id="dateEnd" class="w-full border p-2 rounded text-sm">
                        </div>
                        <textarea id="leaveReason" placeholder="เหตุผล" class="w-full border p-2 rounded h-20"></textarea>
                        <button onclick="saveLeave()" id="btnSubmit" class="w-full bg-blue-700 text-white py-3 rounded font-bold">ส่งข้อมูล</button>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border">
                    <h3 class="font-bold mb-4 border-b pb-2">ประวัติลา (Google Sheets)</h3>
                    <div id="empStatusList">กำลังดึงข้อมูล...</div>
                </div>
            </div>
        </div>

        <div id="page-approver" class="page-section mt-4">
            <h2 class="text-xl font-bold mb-4 text-center">รายการขอลาทั้งหมด</h2>
            <div id="approverList" class="space-y-4">กำลังโหลด...</div>
        </div>
    </div>

    <script>
        // *** วาง URL ของคุณตรงนี้ ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycby9XxamGm9kURRUm2_iu6UFgOPKaMCn3ulBTO6SNxUiMPS84yp6-3krdK0ngm1XeVNF/exec';

        function changePage(pageId) {
            console.log("Go to page:", pageId);
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('page-active'));
            document.getElementById('page-' + pageId).classList.add('page-active');
            document.getElementById('backBtn').style.display = (pageId === 'portal') ? 'none' : 'block';
            if(pageId === 'employee' || pageId === 'approver') loadData();
        }

        function handleLogin() {
            if(document.getElementById('adminPass').value === '1234') changePage('approver');
            else alert('รหัสผิด');
        }

        async function saveLeave() {
            const btn = document.getElementById('btnSubmit');
            const data = {
                name: document.getElementById('empName').value,
                empId: document.getElementById('empId').value,
                empStatus: document.getElementById('empStatus').value,
                leaveType: document.getElementById('leaveType').value,
                start: document.getElementById('dateStart').value,
                end: document.getElementById('dateEnd').value,
                reason: document.getElementById('leaveReason').value || '-',
                status: 'Pending'
            };
            if(!data.name || !data.empId || !data.start) return alert('กรอกข้อมูลไม่ครบ');

            btn.disabled = true; btn.innerText = 'กำลังส่ง...';
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                alert('ส่งสำเร็จ!');
                window.location.reload();
            } catch (e) { alert('พัง: ' + e.message); btn.disabled = false; }
        }

        async function loadData() {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                renderData(data);
            } catch (e) {
                document.getElementById('empStatusList').innerText = "โหลดไม่สำเร็จ หรือยังไม่มีข้อมูล";
                document.getElementById('approverList').innerText = "ไม่มีข้อมูล";
            }
        }

        function renderData(data) {
            const listE = document.getElementById('empStatusList');
            const listA = document.getElementById('approverList');
            if(!data || data.length === 0) return;

            const html = data.slice().reverse().map(row => `
                <div class="p-3 border-b text-sm flex justify-between items-center">
                    <div><b>${row[0]}</b> (${row[3]})<br><small>${row[4]} ถึง ${row[5]}</small></div>
                    <div class="font-bold ${row[7]==='Approved'?'text-green-600':'text-orange-500'}">${row[7]}</div>
                </div>
            `).join('');
            listE.innerHTML = html;
            listA.innerHTML = html; // ในเวอร์ชันนี้แสดงเหมือนกันก่อนเพื่อให้กดไปหน้าได้
        }
    </script>
</body>
</html>
