<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM SKY | Professional Leave System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sarabun:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', 'Sarabun', sans-serif; 
            background-color: #f0f7ff; /* Soft Sky Blue Background */
            color: #1e293b;
        }

        .page-section { display: none; }
        .active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        /* --- New Minimal & Solid Input Style --- */
        .input-group {
            @apply mb-6;
        }

        .label-text {
            @apply text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 block ml-1;
        }

        .field-input {
            @apply w-full p-4 rounded-xl border border-slate-200 bg-white shadow-sm outline-none transition-all text-slate-800;
        }

        /* เมื่อกดที่ช่องจะขึ้นแสงเรืองรอง */
        .field-input:focus {
            @apply border-sky-500 ring-4 ring-sky-100;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.15);
        }

        /* Choice Buttons (Grid) */
        .choice-input:checked + .choice-box {
            @apply border-sky-600 bg-sky-50 text-sky-700 ring-2 ring-sky-100;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.1);
        }

        .choice-box {
            @apply flex items-center justify-center p-3 rounded-xl border border-slate-200 bg-white cursor-pointer text-[12px] font-bold text-slate-500 transition-all hover:border-sky-300;
        }

        .btn-primary {
            @apply bg-slate-900 text-white py-5 rounded-2xl font-bold text-sm uppercase tracking-widest shadow-xl hover:bg-sky-600 active:scale-[0.98] transition-all;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="p-5 px-8 flex justify-between items-center bg-white border-b border-sky-100 sticky top-0 z-50">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="w-10 h-10 bg-sky-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <span class="text-xl font-bold tracking-tighter uppercase">HRM <span class="text-sky-600">SKY</span></span>
        </div>
        <button id="backBtn" onclick="showPage('portal')" class="hidden text-xs font-bold uppercase text-slate-400 hover:text-sky-600">
            <i class="fa-solid fa-chevron-left mr-1"></i> Back
        </button>
    </nav>

    <div class="container mx-auto max-w-6xl p-6">
        
        <div id="page-portal" class="page-section active py-20 text-center">
            <h1 class="text-4xl font-black text-slate-900 mb-4 tracking-tight">System Portal</h1>
            <p class="text-slate-400 mb-12 font-medium">Please select your operation mode</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-2xl mx-auto">
                <div onclick="showPage('employee')" class="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-2xl hover:-translate-y-1 transition-all cursor-pointer">
                    <div class="w-16 h-16 bg-sky-50 text-sky-600 rounded-2xl flex items-center justify-center mx-auto mb-6"><i class="fa-solid fa-user-edit text-2xl"></i></div>
                    <h3 class="text-xl font-bold">Staff Request</h3>
                    <p class="text-slate-400 text-sm mt-2 font-medium">Submit new leave application</p>
                </div>
                <div onclick="showPage('login')" class="bg-slate-900 p-10 rounded-[2.5rem] shadow-xl hover:bg-black transition-all cursor-pointer">
                    <div class="w-16 h-16 bg-slate-800 text-sky-400 rounded-2xl flex items-center justify-center mx-auto mb-6"><i class="fa-solid fa-lock-open text-2xl"></i></div>
                    <h3 class="text-xl font-bold text-white">Approver Area</h3>
                    <p class="text-slate-500 text-sm mt-2 font-medium">Authorize pending requests</p>
                </div>
            </div>
        </div>

        <div id="page-employee" class="page-section">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <div class="lg:col-span-5 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <h2 class="text-2xl font-bold mb-8 text-slate-800 border-l-4 border-sky-500 pl-4">Application Form</h2>

                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group">
                                <label class="label-text">Full Name</label>
                                <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="field-input">
                            </div>
                            <div class="input-group">
                                <label class="label-text">Employee ID</label>
                                <input type="text" id="empId" placeholder="รหัสพนักงาน" class="field-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Employment Status</label>
                            <div class="grid grid-cols-2 gap-2">
                                <label><input type="radio" name="empStatus" value="ประจำ" class="hidden choice-input" checked><div class="choice-box">Permanent</div></label>
                                <label><input type="radio" name="empStatus" value="ชั่วคราว" class="hidden choice-input"><div class="choice-box">Contract</div></label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Production Line</label>
                            <div class="grid grid-cols-3 gap-2">
                                <label><input type="radio" name="empLine" value="C" class="hidden choice-input" checked><div class="choice-box">Line C</div></label>
                                <label><input type="radio" name="empLine" value="E" class="hidden choice-input"><div class="choice-box">Line E</div></label>
                                <label><input type="radio" name="empLine" value="F" class="hidden choice-input"><div class="choice-box">Line F</div></label>
                                <label><input type="radio" name="empLine" value="Office" class="hidden choice-input"><div class="choice-box">Office</div></label>
                                <label><input type="radio" name="empLine" value="TC" class="hidden choice-input"><div class="choice-box">Line TC</div></label>
                                <label><input type="radio" name="empLine" value="Common" class="hidden choice-input"><div class="choice-box">Common</div></label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Process / Department</label>
                            <div class="grid grid-cols-3 gap-2">
                                <label><input type="radio" name="empProcess" value="Assy" class="hidden choice-input" checked><div class="choice-box">ASSY</div></label>
                                <label><input type="radio" name="empProcess" value="Elec" class="hidden choice-input"><div class="choice-box">ELEC</div></label>
                                <label><input type="radio" name="empProcess" value="Pack" class="hidden choice-box-input" name="empProcess"><div class="choice-box">PACK</div></label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Leave Type</label>
                            <div class="grid grid-cols-3 gap-2">
                                <label><input type="radio" name="leaveType" value="ลาป่วย" class="hidden choice-input" checked><div class="choice-box">Sick Leave</div></label>
                                <label><input type="radio" name="leaveType" value="ลากิจ" class="hidden choice-input"><div class="choice-box">Personal</div></label>
                                <label><input type="radio" name="leaveType" value="ลาพักร้อน" class="hidden choice-input"><div class="choice-box">Vacation</div></label>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group">
                                <label class="label-text">From</label>
                                <input type="date" id="dateStart" class="field-input">
                            </div>
                            <div class="input-group">
                                <label class="label-text">To</label>
                                <input type="date" id="dateEnd" class="field-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Reason</label>
                            <textarea id="leaveReason" placeholder="ระบุเหตุผลการลา..." class="field-input h-24 resize-none"></textarea>
                        </div>
                        
                        <div class="input-group">
                            <label class="label-text">Attachment</label>
                            <div class="relative w-full">
                                <input type="file" id="fileInput" accept="image/*" class="field-input text-sm file:mr-4 file:py-1 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-sky-50 file:text-sky-700">
                            </div>
                        </div>

                        <button onclick="submitLeave()" id="submitBtn" class="btn-primary w-full mt-4">Submit Application</button>
                    </div>
                </div>

                <div class="lg:col-span-7 bg-white/50 p-8 rounded-[2.5rem] border border-white">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-xl font-bold">Activity Feed</h3>
                        <button onclick="fetchData()" class="p-2 px-4 rounded-full bg-white text-sky-600 font-bold text-[10px] shadow-sm hover:shadow-md transition-all">
                            <i class="fa-solid fa-sync mr-1"></i> SYNC
                        </button>
                    </div>
                    <div id="empList" class="space-y-3 overflow-y-auto max-h-[850px] no-scrollbar"></div>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section">
            <div class="max-w-md mx-auto mt-20 bg-white p-12 rounded-[3rem] shadow-sm border border-slate-200 text-center">
                <h3 class="text-2xl font-bold mb-10">Admin Access</h3>
                <input type="password" id="adminPass" placeholder="••••" class="field-input text-center text-5xl tracking-[0.4em] mb-10">
                <button onclick="checkLogin()" class="btn-primary w-full">Unlock System</button>
            </div>
        </div>

        <div id="page-approver" class="page-section">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-4xl font-bold text-slate-900">Approvals</h2>
                    <div id="roleBadge" class="mt-2 px-4 py-1 bg-sky-100 text-sky-700 text-[10px] font-bold rounded-full uppercase tracking-widest inline-block"></div>
                </div>
                <button onclick="fetchData()" class="btn-primary px-8 py-3 shadow-none">Refresh</button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </div>

    </div>

    <script>
        // *** REPLACE WITH YOUR URL ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwY6mRSha_DXHVR9umv4qTg1bDo8g3fqVq9yvwJakBuVEdayGRinSKPzA8zdivWapFR/exec'; 

        let currentRole = "";
        let rawData = [];

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('backBtn').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'approver') fetchData();
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            const roles = {'7843':'Assy','1332':'Elec','80006':'Pack','7605':'Sup','9764':'Manager'};
            if(roles[pass]) { currentRole = roles[pass]; document.getElementById('roleBadge').innerText = "Auth: " + currentRole; showPage('approver'); }
            else alert('Access Denied');
        }

        async function getFileData() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return null;
            const file = fileInput.files[0];
            const reader = new FileReader();
            return new Promise(resolve => {
                reader.onload = e => resolve({ base64: e.target.result.split(',')[1], type: file.type, name: file.name });
                reader.readAsDataURL(file);
            });
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const fileData = await getFileData();
            const data = {
                action: 'addLeave',
                NAME: document.getElementById('empName').value,
                ID: document.getElementById('empId').value,
                EMP_STATUS: document.querySelector('input[name="empStatus"]:checked').value,
                LEAVE_TYPE: document.querySelector('input[name="leaveType"]:checked').value,
                LINE: document.querySelector('input[name="empLine"]:checked').value,
                PROCESS: document.querySelector('input[name="empProcess"]:checked').value,
                START: document.getElementById('dateStart').value,
                END: document.getElementById('dateEnd').value,
                REASON: document.getElementById('leaveReason').value || '-',
                FILE: fileData
            };

            if(!data.NAME || !data.ID) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');
            btn.disabled = true; btn.innerText = "Processing...";

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => { alert('Application Submitted'); location.reload(); })
            .catch(() => location.reload());
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL);
                rawData = await res.json();
                renderUI();
            } catch (err) { console.error("Sync Error"); }
        }

        function renderUI() {
            const empArea = document.getElementById('empList');
            const managerArea = document.getElementById('managerList');
            const rows = rawData.slice().reverse();

            empArea.innerHTML = rows.map(r => `
                <div class="bg-white p-5 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100">
                    <div>
                        <div class="font-bold text-slate-800">${r[0]} <span class="text-xs text-slate-300 font-normal">#${r[1]}</span></div>
                        <div class="text-[10px] font-bold text-sky-600 uppercase mt-1 tracking-tight">${r[3]} • Line ${r[9]} • ${r[10]}</div>
                    </div>
                    <div class="px-3 py-1 rounded-lg text-[9px] font-bold uppercase tracking-widest ${r[7]==='Approved'?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600'}">
                        ${r[7]}
                    </div>
                </div>`).join('');

            const filtered = rows.filter(r => r[7] === 'Pending');
            managerArea.innerHTML = filtered.map(r => `
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                    <span class="text-[10px] font-bold text-sky-500 uppercase tracking-widest">${r[3]} Request</span>
                    <h4 class="text-2xl font-bold text-slate-900 mt-1">${r[0]}</h4>
                    <p class="text-xs font-bold text-slate-400 mt-1 uppercase">${r[10]} • Line ${r[9]}</p>
                    <div class="my-6 p-4 bg-slate-50 rounded-xl text-sm italic text-slate-600">"${r[6]}"</div>
                    <div class="flex gap-3">
                        <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-1 bg-slate-900 text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest">Approve</button>
                        <button onclick="updateStatus(${r[16]}, 'Rejected')" class="flex-1 bg-white text-rose-500 border border-rose-100 py-4 rounded-xl font-bold text-xs uppercase tracking-widest">Reject</button>
                    </div>
                </div>`).join('');
            
            if(filtered.length === 0) managerArea.innerHTML = "<p class='col-span-full text-center py-20 text-slate-300 font-bold uppercase tracking-widest'>No Pending Applications</p>";
        }

        async function updateStatus(rowIdx, newStatus) {
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) })
            .then(() => fetchData());
        }
    </script>
</body>
</html>
