<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM SKY | Professional Leave System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sarabun:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', 'Sarabun', sans-serif; 
            /* เพิ่มสีสันพื้นหลังให้ดูพรีเมียมขึ้นด้วย Gradient อ่อนๆ */
            background: linear-gradient(135deg, #f0f7ff 0%, #e8f0fe 50%, #e0e7ff 100%);
            color: #1e293b;
            min-height: 100vh;
        }

        .page-section { display: none; }
        .active { display: block; animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Input Style (หรูหรา โค้งมน) --- */
        .input-group {
            @apply mb-6;
        }

        .label-text {
            @apply text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 block ml-2;
        }

        .field-input {
            @apply w-full p-4 rounded-2xl border-2 border-transparent bg-slate-50/80 shadow-inner outline-none transition-all duration-300 text-slate-800 font-medium;
        }

        /* เมื่อกดที่ช่องกรอกข้อความ */
        .field-input:focus {
            @apply bg-white;
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        /* --- Choice Buttons (ตามเงื่อนไข: ไม่เอากรอบตอนยังไม่กด, กดแล้วมีแสง ไม่มีไฮไลท์พื้นหลัง) --- */
        .choice-box {
            @apply flex items-center justify-center p-3.5 rounded-2xl bg-white text-[12px] font-bold text-slate-500 transition-all duration-300 cursor-pointer;
            border: 2px solid transparent; /* ยังไม่กด ไม่มีกรอบ */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03); /* เงาบางๆ ให้ดูลอยตัว */
        }

        /* โฮเวอร์ตอนยังไม่กด */
        .choice-box:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
        }

        /* เมื่อถูกกดเลือก (Checked) */
        .choice-input:checked + .choice-box {
            @apply bg-white; /* พื้นหลังสีขาวเหมือนเดิม ไม่ไฮไลท์ */
            color: #6366f1; /* เปลี่ยนสีตัวอักษรให้ดูเด่นขึ้น */
            border: 2px solid #6366f1; /* เกิดกรอบสีชัดเจน */
            /* แสงเรืองรอง (Glow Effect) ที่กรอบ */
            box-shadow: 0 0 18px rgba(99, 102, 241, 0.4), inset 0 0 8px rgba(99, 102, 241, 0.1);
            transform: scale(1.03); /* เด้งขึ้นมาเล็กน้อยให้น่ากด */
        }

        /* --- ปรับปุ่ม Submit ให้มีสีสันหรูหรา --- */
        .btn-primary {
            @apply bg-gradient-to-r from-sky-500 to-indigo-500 text-white py-5 rounded-2xl font-bold text-sm uppercase tracking-widest shadow-[0_8px_20px_rgba(99,102,241,0.3)] hover:shadow-[0_12px_25px_rgba(99,102,241,0.5)] hover:-translate-y-1 active:scale-[0.98] transition-all duration-300;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="p-5 px-8 flex justify-between items-center bg-white/80 backdrop-blur-md border-b border-white sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="w-10 h-10 bg-gradient-to-br from-sky-400 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <span class="text-xl font-bold tracking-tighter uppercase">HRM <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-500 to-indigo-500">SKY</span></span>
        </div>
        <button id="backBtn" onclick="showPage('portal')" class="hidden text-xs font-bold uppercase text-slate-400 hover:text-indigo-600 transition-colors">
            <i class="fa-solid fa-chevron-left mr-1"></i> Back
        </button>
    </nav>

    <div class="container mx-auto max-w-6xl p-6">
        
        <div id="page-portal" class="page-section active py-20 text-center">
            <h1 class="text-4xl font-black text-slate-900 mb-4 tracking-tight">System Portal</h1>
            <p class="text-slate-500 mb-12 font-medium">Please select your operation mode</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-2xl mx-auto">
                <div onclick="showPage('employee')" class="bg-white p-10 rounded-[2.5rem] border border-white shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 cursor-pointer">
                    <div class="w-16 h-16 bg-gradient-to-br from-sky-100 to-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner"><i class="fa-solid fa-user-edit text-2xl"></i></div>
                    <h3 class="text-xl font-bold text-slate-800">Staff Request</h3>
                    <p class="text-slate-400 text-sm mt-2 font-medium">Submit new leave application</p>
                </div>
                <div onclick="showPage('login')" class="bg-slate-900 p-10 rounded-[2.5rem] shadow-xl hover:shadow-2xl hover:bg-slate-800 hover:-translate-y-2 transition-all duration-300 cursor-pointer">
                    <div class="w-16 h-16 bg-slate-800 text-sky-400 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-slate-700"><i class="fa-solid fa-lock-open text-2xl"></i></div>
                    <h3 class="text-xl font-bold text-white">Approver Area</h3>
                    <p class="text-slate-400 text-sm mt-2 font-medium">Authorize pending requests</p>
                </div>
            </div>
        </div>

        <div id="page-employee" class="page-section">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <!-- ฟอร์มพนักงาน (ปรับความหรูหรา โค้งมน) -->
                <div class="lg:col-span-5 bg-white/90 backdrop-blur-xl p-10 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-white relative overflow-hidden">
                    <!-- วงกลมตกแต่งเพิ่มสีสันด้านหลังฟอร์ม -->
                    <div class="absolute top-0 right-0 w-32 h-32 bg-sky-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 translate-x-1/2 -translate-y-1/2"></div>
                    <div class="absolute bottom-0 left-0 w-40 h-40 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 -translate-x-1/2 translate-y-1/2"></div>
                    
                    <h2 class="text-2xl font-bold mb-8 text-slate-800 flex items-center relative z-10">
                        <span class="w-2 h-8 bg-gradient-to-b from-sky-400 to-indigo-500 rounded-full mr-3"></span>
                        Application Form
                    </h2>

                    <div class="space-y-6 relative z-10">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group">
                                <label class="label-text">Full Name</label>
                                <input type="text" id="empName" placeholder="ชื่อ-นามสกุล" class="field-input">
                            </div>
                            <div class="input-group">
                                <label class="label-text">Employee ID</label>
                                <input type="text" id="empId" placeholder="รหัสพนักงาน" class="field-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Employment Status</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label><input type="radio" name="empStatus" value="ประจำ" class="hidden choice-input" checked><div class="choice-box">Permanent</div></label>
                                <label><input type="radio" name="empStatus" value="ชั่วคราว" class="hidden choice-input"><div class="choice-box">Contract</div></label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Production Line</label>
                            <div class="grid grid-cols-3 gap-3">
                                <label><input type="radio" name="empLine" value="C" class="hidden choice-input" checked><div class="choice-box">Line C</div></label>
                                <label><input type="radio" name="empLine" value="E" class="hidden choice-input"><div class="choice-box">Line E</div></label>
                                <label><input type="radio" name="empLine" value="F" class="hidden choice-input"><div class="choice-box">Line F</div></label>
                                <label><input type="radio" name="empLine" value="Office" class="hidden choice-input"><div class="choice-box">Office</div></label>
                                <label><input type="radio" name="empLine" value="TC" class="hidden choice-input"><div class="choice-box">Line TC</div></label>
                                <label><input type="radio" name="empLine" value="Common" class="hidden choice-input"><div class="choice-box">Common</div></label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Process / Department</label>
                            <div class="grid grid-cols-3 gap-3">
                                <label><input type="radio" name="empProcess" value="Assy" class="hidden choice-input" checked><div class="choice-box">ASSY</div></label>
                                <label><input type="radio" name="empProcess" value="Elec" class="hidden choice-input"><div class="choice-box">ELEC</div></label>
                                <label><input type="radio" name="empProcess" value="Pack" class="hidden choice-input"><div class="choice-box">PACK</div></label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Leave Type</label>
                            <div class="grid grid-cols-3 gap-3">
                                <label><input type="radio" name="leaveType" value="ลาป่วย" class="hidden choice-input" checked><div class="choice-box">Sick Leave</div></label>
                                <label><input type="radio" name="leaveType" value="ลากิจ" class="hidden choice-input"><div class="choice-box">Personal</div></label>
                                <label><input type="radio" name="leaveType" value="ลาพักร้อน" class="hidden choice-input"><div class="choice-box">Vacation</div></label>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group">
                                <label class="label-text">From</label>
                                <input type="date" id="dateStart" class="field-input">
                            </div>
                            <div class="input-group">
                                <label class="label-text">To</label>
                                <input type="date" id="dateEnd" class="field-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="label-text">Reason</label>
                            <textarea id="leaveReason" placeholder="ระบุเหตุผลการลา..." class="field-input h-28 resize-none"></textarea>
                        </div>
                        
                        <div class="input-group">
                            <label class="label-text">Attachment</label>
                            <div class="relative w-full">
                                <input type="file" id="fileInput" accept="image/*" class="field-input text-sm file:mr-4 file:py-2 file:px-5 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 file:transition-colors file:cursor-pointer">
                            </div>
                        </div>

                        <button onclick="submitLeave()" id="submitBtn" class="btn-primary w-full mt-6">Submit Application</button>
                    </div>
                </div>

                <div class="lg:col-span-7 p-8 rounded-[2.5rem]">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-2xl font-bold text-slate-800">Activity Feed</h3>
                        <button onclick="fetchData()" class="p-2 px-5 rounded-full bg-white text-indigo-600 font-bold text-[11px] shadow-sm hover:shadow-md hover:bg-indigo-50 transition-all border border-indigo-100">
                            <i class="fa-solid fa-sync mr-1"></i> SYNC
                        </button>
                    </div>
                    <div id="empList" class="space-y-4 overflow-y-auto max-h-[850px] no-scrollbar pb-10"></div>
                </div>
            </div>
        </div>

        <div id="page-login" class="page-section">
            <div class="max-w-md mx-auto mt-20 bg-white p-12 rounded-[3rem] shadow-2xl border border-white text-center relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-50 rounded-full blur-2xl"></div>
                <h3 class="text-2xl font-bold mb-10 text-slate-800 relative z-10">Admin Access</h3>
                <input type="password" id="adminPass" placeholder="••••" class="field-input text-center text-5xl tracking-[0.4em] mb-10 relative z-10 bg-slate-50/50">
                <button onclick="checkLogin()" class="btn-primary w-full relative z-10">Unlock System</button>
            </div>
        </div>

        <div id="page-approver" class="page-section">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-4xl font-bold text-slate-900">Approvals</h2>
                    <div id="roleBadge" class="mt-3 px-5 py-1.5 bg-gradient-to-r from-sky-100 to-indigo-100 text-indigo-700 text-[11px] font-bold rounded-full uppercase tracking-widest inline-block shadow-sm"></div>
                </div>
                <button onclick="fetchData()" class="btn-primary px-8 py-3 shadow-[0_8px_20px_rgba(99,102,241,0.2)]">Refresh</button>
            </div>
            <div id="managerList" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </div>

    </div>

    <script>
        // *** REPLACE WITH YOUR URL ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwY6mRSha_DXHVR9umv4qTg1bDo8g3fqVq9yvwJakBuVEdayGRinSKPzA8zdivWapFR/exec'; 

        let currentRole = "";
        let rawData = [];

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('backBtn').classList.toggle('hidden', id === 'portal');
            if(id === 'employee' || id === 'approver') fetchData();
        }

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            const roles = {'7843':'Assy','1332':'Elec','80006':'Pack','7605':'Sup','9764':'Manager'};
            if(roles[pass]) { currentRole = roles[pass]; document.getElementById('roleBadge').innerText = "Auth: " + currentRole; showPage('approver'); }
            else alert('Access Denied');
        }

        async function getFileData() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return null;
            const file = fileInput.files[0];
            const reader = new FileReader();
            return new Promise(resolve => {
                reader.onload = e => resolve({ base64: e.target.result.split(',')[1], type: file.type, name: file.name });
                reader.readAsDataURL(file);
            });
        }

        async function submitLeave() {
            const btn = document.getElementById('submitBtn');
            const fileData = await getFileData();
            const data = {
                action: 'addLeave',
                NAME: document.getElementById('empName').value,
                ID: document.getElementById('empId').value,
                EMP_STATUS: document.querySelector('input[name="empStatus"]:checked').value,
                LEAVE_TYPE: document.querySelector('input[name="leaveType"]:checked').value,
                LINE: document.querySelector('input[name="empLine"]:checked').value,
                PROCESS: document.querySelector('input[name="empProcess"]:checked').value,
                START: document.getElementById('dateStart').value,
                END: document.getElementById('dateEnd').value,
                REASON: document.getElementById('leaveReason').value || '-',
                FILE: fileData
            };

            if(!data.NAME || !data.ID) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');
            btn.disabled = true; btn.innerText = "Processing...";

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => { alert('Application Submitted'); location.reload(); })
            .catch(() => location.reload());
        }

        async function fetchData() {
            try {
                const res = await fetch(scriptURL);
                rawData = await res.json();
                renderUI();
            } catch (err) { console.error("Sync Error"); }
        }

        function renderUI() {
            const empArea = document.getElementById('empList');
            const managerArea = document.getElementById('managerList');
            const rows = rawData.slice().reverse();

            empArea.innerHTML = rows.map(r => `
                <div class="bg-white/90 backdrop-blur-md p-6 rounded-[2rem] flex justify-between items-center shadow-sm border border-white hover:shadow-md transition-shadow">
                    <div>
                        <div class="font-bold text-slate-800 text-lg">${r[0]} <span class="text-xs text-slate-400 font-medium ml-2">#${r[1]}</span></div>
                        <div class="text-[11px] font-bold text-indigo-500 uppercase mt-2 tracking-wide flex items-center gap-2">
                            <i class="fa-solid fa-briefcase opacity-70"></i> ${r[3]} • Line ${r[9]} • ${r[10]}
                        </div>
                    </div>
                    <div class="px-4 py-1.5 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-sm ${r[7]==='Approved'?'bg-gradient-to-r from-emerald-50 to-teal-50 text-emerald-600 border border-emerald-100':'bg-gradient-to-r from-amber-50 to-orange-50 text-amber-600 border border-amber-100'}">
                        ${r[7]}
                    </div>
                </div>`).join('');

            const filtered = rows.filter(r => r[7] === 'Pending');
            managerArea.innerHTML = filtered.map(r => `
                <div class="bg-white p-8 rounded-[2.5rem] border border-white shadow-[0_10px_40px_rgba(0,0,0,0.05)] relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-indigo-400"></div>
                    <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest">${r[3]} Request</span>
                    <h4 class="text-2xl font-bold text-slate-900 mt-2">${r[0]}</h4>
                    <p class="text-xs font-bold text-slate-400 mt-2 uppercase flex items-center gap-2">
                        <i class="fa-regular fa-id-badge"></i> ${r[10]} • Line ${r[9]}
                    </p>
                    <div class="my-6 p-5 bg-slate-50/80 rounded-2xl text-sm italic text-slate-600 border border-slate-100 shadow-inner">"${r[6]}"</div>
                    <div class="flex gap-4">
                        <button onclick="updateStatus(${r[16]}, 'Approved')" class="flex-1 bg-gradient-to-r from-slate-800 to-slate-900 text-white py-4 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all">Approve</button>
                        <button onclick="updateStatus(${r[16]}, 'Rejected')" class="flex-1 bg-white text-rose-500 border-2 border-rose-100 py-4 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-rose-50 hover:border-rose-200 transition-all">Reject</button>
                    </div>
                </div>`).join('');
            
            if(filtered.length === 0) managerArea.innerHTML = "<div class='col-span-full flex flex-col items-center justify-center py-20 opacity-50'><i class='fa-solid fa-inbox text-5xl mb-4 text-slate-300'></i><p class='text-slate-400 font-bold uppercase tracking-widest'>No Pending Applications</p></div>";
        }

        async function updateStatus(rowIdx, newStatus) {
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStatus', rowIdx: rowIdx, status: newStatus, role: currentRole }) })
            .then(() => fetchData());
        }
    </script>
</body>
</html>
